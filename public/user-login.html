<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login | Syzhaa File</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .brutal-border { border: 3px solid #0f172a; }
        .brutal-shadow { box-shadow: 6px 6px 0px #0f172a; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-4">
    <div class="max-w-md w-full">
        <div class="bg-white brutal-border brutal-shadow p-8 rounded-lg">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-600 rounded-full text-white flex items-center justify-center brutal-border mx-auto mb-4 text-2xl font-bold">
                    S
                </div>
                <h1 class="text-3xl font-bold text-slate-900 mb-2">Syzhaa File</h1>
                <p class="text-slate-600">Login untuk akses file sharing</p>
            </div>

            <a href="/auth/user/callback" 
               class="block w-full bg-white brutal-border hover:translate-x-1 hover:translate-y-1 hover:shadow-none brutal-shadow transition-all duration-150 rounded-lg p-4 text-center font-semibold text-slate-900 mb-4">
                <div class="flex items-center justify-center gap-3">
                    <svg class="w-6 h-6" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Sign in with Google
                </div>
            </a>

            <div class="text-center text-sm text-slate-500 space-y-2">
                <p>Akun baru memerlukan approval dari admin</p>
                <p>Setelah disetujui, kamu akan mendapat:</p>
                <ul class="text-left bg-slate-50 p-3 rounded mt-2">
                    <li>✓ Storage quota</li>
                    <li>✓ Upload file besar</li>
                    <li>✓ Room management</li>
                </ul>
            </div>
        </div>

        <div class="text-center mt-6 space-y-2">
            <a href="/" class="block text-slate-600 hover:text-slate-900 font-medium">
                ← Kembali ke Home
            </a>
            <a href="/admin/login.html" class="block text-xs text-slate-500 hover:text-slate-700">
                Login sebagai Admin
            </a>
        </div>
    </div>
</body>
</html>
