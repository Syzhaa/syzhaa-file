<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .brutal-border { border: 3px solid #0f172a; }
        .brutal-shadow { box-shadow: 6px 6px 0px #0f172a; }
        .brutal-border-thin { border: 2px solid #0f172a; }
    </style>
</head>
<body class="min-h-screen bg-slate-50">
    <div id="loading" class="fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50">
        <div class="bg-white brutal-border brutal-shadow p-8 rounded-lg">
            <div class="animate-spin h-12 w-12 border-4 border-slate-900 border-t-transparent rounded-full mx-auto"></div>
            <p class="mt-4 text-slate-900 font-semibold">Loading...</p>
        </div>
    </div>

    <div id="app" class="hidden">
        <header class="bg-white brutal-border-thin border-b sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <h1 class="text-2xl font-bold text-slate-900">User Management</h1>
                    <a href="/admin/dashboard.html" class="text-sm text-blue-600 hover:text-blue-800">← Back to Dashboard</a>
                </div>
                <div class="flex items-center gap-3">
                    <img id="adminAvatar" class="w-10 h-10 rounded-full brutal-border-thin" src="" alt="">
                    <span id="adminName" class="font-semibold text-slate-900"></span>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-8">
            <!-- Filter Tabs -->
            <div class="flex gap-2 mb-6">
                <button onclick="filterUsers('all')" id="tab-all" class="px-4 py-2 font-semibold rounded brutal-border-thin bg-slate-900 text-white">
                    All <span id="count-all" class="ml-2">0</span>
                </button>
                <button onclick="filterUsers('pending')" id="tab-pending" class="px-4 py-2 font-semibold rounded brutal-border-thin bg-yellow-500 text-white">
                    Pending <span id="count-pending" class="ml-2">0</span>
                </button>
                <button onclick="filterUsers('approved')" id="tab-approved" class="px-4 py-2 font-semibold rounded brutal-border-thin bg-green-500 text-white">
                    Approved <span id="count-approved" class="ml-2">0</span>
                </button>
                <button onclick="filterUsers('rejected')" id="tab-rejected" class="px-4 py-2 font-semibold rounded brutal-border-thin bg-red-500 text-white">
                    Rejected <span id="count-rejected" class="ml-2">0</span>
                </button>
                <button onclick="filterUsers('suspended')" id="tab-suspended" class="px-4 py-2 font-semibold rounded brutal-border-thin bg-orange-500 text-white">
                    Suspended <span id="count-suspended" class="ml-2">0</span>
                </button>
            </div>

            <!-- System Settings -->
            <div class="bg-white brutal-border brutal-shadow rounded-lg p-6 mb-6">
                <h2 class="text-xl font-bold text-slate-900 mb-4">Default User Settings</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-900 mb-2">Default Storage (MB)</label>
                        <input id="default-storage" type="number" class="w-full px-4 py-2 brutal-border-thin rounded" value="5120">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-900 mb-2">Default Duration (days)</label>
                        <input id="default-duration" type="number" class="w-full px-4 py-2 brutal-border-thin rounded" value="7">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-900 mb-2">Require Approval</label>
                        <select id="require-approval" class="w-full px-4 py-2 brutal-border-thin rounded">
                            <option value="true">Yes</option>
                            <option value="false">No</option>
                        </select>
                    </div>
                </div>
                <button onclick="saveSettings()" class="mt-4 px-6 py-2 bg-slate-900 text-white font-semibold rounded brutal-border-thin hover:bg-slate-800">
                    Save Settings
                </button>
            </div>

            <!-- User List -->
            <div id="usersList" class="space-y-4">
                <!-- Populated by JS -->
            </div>
        </main>
    </div>

    <!-- Approve Modal -->
    <div id="approveModal" class="hidden fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50 p-4">
        <div class="bg-white brutal-border brutal-shadow rounded-lg p-6 max-w-md w-full">
            <h3 class="text-xl font-bold text-slate-900 mb-4">Approve User</h3>
            <input type="hidden" id="approve-user-id">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-900 mb-2">Storage Limit (MB)</label>
                    <input id="approve-storage" type="number" class="w-full px-4 py-2 brutal-border-thin rounded" placeholder="Leave empty for default">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-900 mb-2">Max File Duration (days)</label>
                    <input id="approve-duration" type="number" class="w-full px-4 py-2 brutal-border-thin rounded" placeholder="Leave empty for default">
                </div>
                <div class="flex gap-3">
                    <button onclick="confirmApprove()" class="flex-1 px-4 py-2 bg-green-500 text-white font-semibold rounded brutal-border-thin hover:bg-green-600">
                        Approve
                    </button>
                    <button onclick="closeApproveModal()" class="flex-1 px-4 py-2 bg-slate-200 text-slate-900 font-semibold rounded brutal-border-thin hover:bg-slate-300">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Reject Modal -->
    <div id="rejectModal" class="hidden fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50 p-4">
        <div class="bg-white brutal-border brutal-shadow rounded-lg p-6 max-w-md w-full">
            <h3 class="text-xl font-bold text-slate-900 mb-4">Reject User</h3>
            <input type="hidden" id="reject-user-id">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-900 mb-2">Reason (optional)</label>
                    <textarea id="reject-reason" class="w-full px-4 py-2 brutal-border-thin rounded" rows="3" placeholder="Rejection reason..."></textarea>
                </div>
                <div class="flex gap-3">
                    <button onclick="confirmReject()" class="flex-1 px-4 py-2 bg-red-500 text-white font-semibold rounded brutal-border-thin hover:bg-red-600">
                        Reject
                    </button>
                    <button onclick="closeRejectModal()" class="flex-1 px-4 py-2 bg-slate-200 text-slate-900 font-semibold rounded brutal-border-thin hover:bg-slate-300">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="/admin/users.js"></script>
</body>
</html>
