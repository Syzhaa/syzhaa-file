<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | AmbilFile</title>
    <link rel="stylesheet" href="/../dist-output.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
        .field:focus { border-color: #F6821F; box-shadow: 0 0 0 3px rgba(246,130,31,.15); outline: none; }
    </style>
</head>
<body class="min-h-screen bg-wash flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <a href="/" class="inline-flex items-center gap-2">
                <span class="w-10 h-10 rounded-xl bg-ink text-white flex items-center justify-center">
                    <span class="material-symbols-outlined text-[24px]">folder_shared</span>
                </span>
                <span class="text-xl font-extrabold tracking-tight">AmbilFile</span>
            </a>
            <p class="text-sm text-muted mt-2">Panel Admin</p>
        </div>

        <div class="bg-white border border-line rounded-2xl p-6 sm:p-8" style="box-shadow: 0 12px 32px rgba(16,24,40,.12)">
            <h1 class="text-xl font-extrabold mb-1">Masuk sebagai Admin</h1>
            <p class="text-sm text-muted mb-6">Gunakan email dan password admin.</p>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1.5" for="email">Email</label>
                    <input type="email" id="email" required autocomplete="username" placeholder="admin@example.com"
                        class="field w-full px-4 py-3 border border-line rounded-lg text-[15px]">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1.5" for="password">Password</label>
                    <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••"
                        class="field w-full px-4 py-3 border border-line rounded-lg text-[15px]">
                </div>
                <p id="errorMsg" class="hidden text-sm text-red-600 font-medium bg-red-50 border border-red-100 rounded-lg px-3.5 py-2.5"></p>
                <button type="submit" id="loginBtn"
                    class="w-full py-3.5 bg-brand-500 hover:bg-brand-600 disabled:opacity-60 text-white rounded-lg font-semibold transition-colors">
                    Masuk
                </button>
            </form>
        </div>

        <div class="text-center mt-6">
            <a href="/" class="text-sm font-medium text-muted hover:text-ink inline-flex items-center gap-1.5">
                <span class="material-symbols-outlined text-[18px]">arrow_back</span> Kembali ke beranda
            </a>
        </div>
    </div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('errorMsg');
    err.classList.add('hidden');
    btn.disabled = true;
    btn.textContent = 'Memproses...';
    try {
        const res = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value
            })
        });
        const data = await res.json();
        if (data.success) {
            window.location.href = '/admin';
        } else {
            err.textContent = data.error || 'Login gagal. Periksa email dan password.';
            err.classList.remove('hidden');
        }
    } catch (e) {
        err.textContent = 'Terjadi kesalahan koneksi. Coba lagi.';
        err.classList.remove('hidden');
    }
    btn.disabled = false;
    btn.textContent = 'Masuk';
});
</script>
</body>
</html>
