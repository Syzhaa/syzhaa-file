<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: {
            colors: { brand: { 50:'#FFF7ED',500:'#F6821F',600:'#E06F0A' }, ink: '#101828', muted: '#667085', line: '#EAECF0', wash: '#F9FAFB' },
            fontFamily: { sans: ['Inter','system-ui','sans-serif'] }
        } } }
    </script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
        .field:focus { border-color: #F6821F; box-shadow: 0 0 0 3px rgba(246,130,31,.15); outline: none; }
    </style>
</head>
<body class="min-h-screen bg-wash">
    <div id="loading" class="fixed inset-0 bg-ink/50 flex items-center justify-center z-50">
        <div class="bg-white border border-line shadow-card p-8 rounded-lg">
            <div class="animate-spin h-12 w-12 border-4 border-ink border-t-transparent rounded-full mx-auto"></div>
            <p class="mt-4 text-ink font-semibold">Loading...</p>
        </div>
    </div>

    <div id="app" class="hidden">
        <header class="bg-white border border-line border-b sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <h1 class="text-2xl font-bold text-ink">User Management</h1>
                    <a href="/admin/dashboard.html" class="text-sm text-brand-600 hover:text-brand-700 font-medium">← Back to Dashboard</a>
                </div>
                <div class="flex items-center gap-3">
                    <img id="adminAvatar" class="w-10 h-10 rounded-full border border-line" src="" alt="">
                    <span id="adminName" class="font-semibold text-ink"></span>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-8">
            <!-- Filter Tabs -->
            <div class="flex gap-2 mb-6">
                <button onclick="filterUsers('all')" id="tab-all" class="px-4 py-2 font-semibold rounded border border-line bg-ink text-white">
                    All <span id="count-all" class="ml-2">0</span>
                </button>
                <button onclick="filterUsers('pending')" id="tab-pending" class="px-4 py-2 font-semibold rounded border border-line bg-yellow-500 text-white">
                    Pending <span id="count-pending" class="ml-2">0</span>
                </button>
                <button onclick="filterUsers('approved')" id="tab-approved" class="px-4 py-2 font-semibold rounded border border-line bg-green-500 text-white">
                    Approved <span id="count-approved" class="ml-2">0</span>
                </button>
                <button onclick="filterUsers('rejected')" id="tab-rejected" class="px-4 py-2 font-semibold rounded border border-line bg-red-500 text-white">
                    Rejected <span id="count-rejected" class="ml-2">0</span>
                </button>
                <button onclick="filterUsers('suspended')" id="tab-suspended" class="px-4 py-2 font-semibold rounded border border-line bg-orange-500 text-white">
                    Suspended <span id="count-suspended" class="ml-2">0</span>
                </button>
            </div>

            <!-- System Settings -->
            <div class="bg-white border border-line shadow-card rounded-lg p-6 mb-6">
                <h2 class="text-xl font-bold text-ink mb-4">Batas Penyimpanan</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-ink mb-2">User Terdaftar (MB)</label>
                        <input id="default-storage" type="number" class="w-full px-4 py-2 border border-line rounded" value="2048">
                        <p class="text-xs text-gray-500 mt-1">Default 2048 MB = 2 GB</p>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-ink mb-2">Tanpa Login / Room (MB)</label>
                        <input id="anonymous-storage" type="number" class="w-full px-4 py-2 border border-line rounded" value="1024">
                        <p class="text-xs text-gray-500 mt-1">Default 1024 MB = 1 GB per room</p>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-ink mb-2">Default Duration (days)</label>
                        <input id="default-duration" type="number" class="w-full px-4 py-2 border border-line rounded" value="7">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
                    <div>
                        <label class="block text-sm font-semibold text-ink mb-2">Require Approval</label>
                        <select id="require-approval" class="w-full px-4 py-2 border border-line rounded">
                            <option value="true">Yes</option>
                            <option value="false">No</option>
                        </select>
                    </div>
                </div>
                <button onclick="saveSettings()" class="mt-4 px-6 py-2 bg-ink text-white font-semibold rounded-lg border border-line hover:bg-black">
                    Simpan Pengaturan
                </button>
            </div>

            <!-- User List -->
            <div id="usersList" class="space-y-4">
                <!-- Populated by JS -->
            </div>
        </main>
    </div>

    <!-- Approve Modal -->
    <div id="approveModal" class="hidden fixed inset-0 bg-ink/50 flex items-center justify-center z-50 p-4">
        <div class="bg-white border border-line shadow-card rounded-lg p-6 max-w-md w-full">
            <h3 class="text-xl font-bold text-ink mb-4">Approve User</h3>
            <input type="hidden" id="approve-user-id">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-ink mb-2">Storage Limit (MB)</label>
                    <input id="approve-storage" type="number" class="w-full px-4 py-2 border border-line rounded" placeholder="Leave empty for default">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-ink mb-2">Max File Duration (days)</label>
                    <input id="approve-duration" type="number" class="w-full px-4 py-2 border border-line rounded" placeholder="Leave empty for default">
                </div>
                <div class="flex gap-3">
                    <button onclick="confirmApprove()" class="flex-1 px-4 py-2 bg-green-500 text-white font-semibold rounded border border-line hover:bg-green-600">
                        Approve
                    </button>
                    <button onclick="closeApproveModal()" class="flex-1 px-4 py-2 bg-slate-200 text-ink font-semibold rounded border border-line hover:border-ink">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Reject Modal -->
    <div id="rejectModal" class="hidden fixed inset-0 bg-ink/50 flex items-center justify-center z-50 p-4">
        <div class="bg-white border border-line shadow-card rounded-lg p-6 max-w-md w-full">
            <h3 class="text-xl font-bold text-ink mb-4">Reject User</h3>
            <input type="hidden" id="reject-user-id">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-ink mb-2">Reason (optional)</label>
                    <textarea id="reject-reason" class="w-full px-4 py-2 border border-line rounded" rows="3" placeholder="Rejection reason..."></textarea>
                </div>
                <div class="flex gap-3">
                    <button onclick="confirmReject()" class="flex-1 px-4 py-2 bg-red-500 text-white font-semibold rounded border border-line hover:bg-red-600">
                        Reject
                    </button>
                    <button onclick="closeRejectModal()" class="flex-1 px-4 py-2 bg-slate-200 text-ink font-semibold rounded border border-line hover:border-ink">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Generic Info Modal (pengganti alert) -->
    <div id="infoModal" class="hidden fixed inset-0 bg-ink/50 flex items-center justify-center z-[60] p-4" onclick="if(event.target===this)closeInfoModal()">
        <div class="bg-white rounded-2xl shadow-pop max-w-sm w-full p-6 text-center">
            <div id="infoModalIcon" class="w-12 h-12 rounded-xl flex items-center justify-center mx-auto mb-4">
                <span class="material-symbols-outlined text-3xl" id="infoModalGlyph">info</span>
            </div>
            <p id="infoModalMsg" class="text-sm text-ink font-medium mb-6"></p>
            <button onclick="closeInfoModal()" class="w-full py-2.5 bg-ink text-white font-semibold rounded hover:bg-black">OK</button>
        </div>
    </div>

    <!-- Generic Confirm Modal (pengganti confirm) -->
    <div id="confirmModal" class="hidden fixed inset-0 bg-ink/50 flex items-center justify-center z-[60] p-4" onclick="if(event.target===this)closeConfirmModal()">
        <div class="bg-white rounded-2xl shadow-pop max-w-sm w-full p-6 text-center">
            <div class="w-12 h-12 rounded-xl flex items-center justify-center mx-auto mb-4 bg-red-50 border border-red-100 text-red-500">
                <span class="material-symbols-outlined text-3xl">warning</span>
            </div>
            <p id="confirmModalMsg" class="text-sm text-ink font-medium mb-6"></p>
            <div class="flex gap-2">
                <button onclick="closeConfirmModal()" class="flex-1 py-2.5 border border-line rounded font-semibold hover:border-ink">Batal</button>
                <button id="confirmModalYes" class="flex-1 py-2.5 bg-red-500 text-white font-semibold rounded hover:bg-red-600">Ya</button>
            </div>
        </div>
    </div>

    <!-- Generic Prompt Modal (pengganti prompt) -->
    <div id="promptModal" class="hidden fixed inset-0 bg-ink/50 flex items-center justify-center z-[60] p-4" onclick="if(event.target===this)closePromptModal()">
        <div class="bg-white rounded-2xl shadow-pop max-w-sm w-full p-6">
            <p id="promptModalMsg" class="text-sm text-ink font-medium mb-4"></p>
            <input type="text" id="promptModalInput" class="w-full px-4 py-2.5 border-2 border-line rounded-xl focus:border-primary focus:outline-none text-sm mb-4">
            <div class="flex gap-2">
                <button onclick="closePromptModal()" class="flex-1 py-2.5 border border-line rounded font-semibold hover:border-ink">Batal</button>
                <button id="promptModalYes" class="flex-1 py-2.5 bg-ink text-white font-semibold rounded hover:bg-black">OK</button>
            </div>
        </div>
    </div>

    <script src="/admin/users.js"></script>
</body>
</html>
