<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar — AmbilFile</title>
    <link rel="icon" href="/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: #f7f8fa; color: #1a1a2e; min-height: 100vh; display: flex; flex-direction: column; }
        .top { padding: 20px 24px; }
        .top a { text-decoration: none; font-weight: 800; font-size: 20px; color: #1a1a2e; }
        .top a span { color: #F6821F; }
        .wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .card { background: #fff; border: 1px solid #e8eaf0; border-radius: 16px; padding: 36px; width: 100%; max-width: 420px; box-shadow: 0 8px 32px rgba(0,0,0,.06); }
        h1 { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
        .sub { color: #6b7280; font-size: 14px; margin-bottom: 28px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        input { width: 100%; padding: 12px 14px; border: 1.5px solid #e8eaf0; border-radius: 10px; font-size: 15px; font-family: inherit; margin-bottom: 16px; transition: border-color .2s; }
        input:focus { outline: none; border-color: #F6821F; }
        .btn { width: 100%; padding: 13px; background: #F6821F; color: #fff; border: 0; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; transition: background .2s; }
        .btn:hover { background: #e06f0e; }
        .btn:disabled { opacity: .6; cursor: not-allowed; }
        .btn-google { width: 100%; padding: 13px; background: #fff; color: #1f2937; border: 1px solid #e5e7eb; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background .2s; }
        .btn-google:hover { background: #f9fafb; }
        .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: #9ca3af; font-size: 12px; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e5e7eb; }
        .err { display: none; background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; font-size: 13px; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; }
        .ok { display: none; background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; font-size: 13px; padding: 12px 14px; border-radius: 10px; margin-bottom: 16px; line-height: 1.5; }
        .foot { text-align: center; margin-top: 20px; font-size: 14px; color: #6b7280; }
        .foot a { color: #F6821F; font-weight: 600; text-decoration: none; }
        .note { font-size: 12px; color: #9ca3af; margin-top: 16px; text-align: center; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="top"><a href="/">Ambil<span>File</span></a></div>
    <div class="wrap">
        <div class="card">
            <h1>Buat akun AmbilFile</h1>
            <p class="sub">Daftar gratis untuk mendapatkan API key.</p>
            <div class="err" id="err"></div>
            <div class="ok" id="ok"></div>
            <button class="btn-google" onclick="location.href='/auth/user/google'">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                Daftar dengan Google
            </button>
            <div class="divider">atau</div>
            <form id="reg-form">
                <label for="name">Nama</label>
                <input type="text" id="name" placeholder="Nama kamu" required autocomplete="name">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="kamu@email.com" required autocomplete="email">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Minimal 6 karakter" required autocomplete="new-password" minlength="6">
                <button type="submit" class="btn" id="submit-btn">Daftar</button>
            </form>
            <p class="note">Setelah mendaftar kamu langsung bisa masuk. Untuk membuat API key perlu persetujuan admin.</p>
            <p class="foot">Sudah punya akun? <a href="/user-login.html">Masuk</a></p>
        </div>
    </div>
    <script>
        document.getElementById('reg-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const err = document.getElementById('err');
            const ok = document.getElementById('ok');
            err.style.display = 'none';
            ok.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Mendaftar...';
            try {
                const res = await fetch('/auth/user/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById('name').value.trim(),
                        email: document.getElementById('email').value.trim(),
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('reg-form').style.display = 'none';
                    ok.textContent = 'Pendaftaran berhasil! Silakan masuk lewat halaman login.';
                    ok.style.display = 'block';
                } else {
                    err.textContent = data.error || 'Pendaftaran gagal';
                    err.style.display = 'block';
                }
            } catch {
                err.textContent = 'Tidak bisa terhubung ke server';
                err.style.display = 'block';
            }
            btn.disabled = false;
            btn.textContent = 'Daftar';
        });
    </script>
</body>
</html>
