<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room - AmbilFile</title>
    <link rel="stylesheet" href="/dist-output.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; }
        .drag-over { border-color: #F6821F !important; background: rgba(246,130,31,.06) !important; }
        @keyframes pulse-timer { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .timer-pulse { animation: pulse-timer 2s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { animation: spin 1s linear infinite; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #EAECF0; z-index: 50; padding-bottom: env(safe-area-inset-bottom); }
        .bottom-nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 8px 8px; color: #667085; gap: 2px; font-size: 11px; font-weight: 500; }
        .bottom-nav-item.active { color: #F6821F; }
        .bottom-nav-item .material-symbols-outlined { font-size: 24px; }
        @media (min-width: 768px) { .bottom-nav { display: none; } }
        @media (max-width: 767px) { body { padding-bottom: 72px; } }
        .field:focus { border-color: #F6821F !important; box-shadow: 0 0 0 3px rgba(246,130,31,.15); outline: none; }
        /* Bottom sheet modals on mobile */
        @media (max-width: 767px) {
            #info-modal, #confirm-modal, #error-modal { align-items: flex-end !important; padding: 0 !important; }
            #info-modal > div, #confirm-modal > div, #error-modal > div {
                border-radius: 24px 24px 0 0 !important;
                max-width: 100% !important;
                width: 100% !important;
                animation: sheetUp .3s ease-out;
            }
            @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        }
    </style>
    
</head>
<body class="bg-wash text-ink">

<!-- Header -->
<header class="bg-white border-b border-line sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
        <a href="/" class="flex items-center gap-2">
            <span class="w-8 h-8 rounded-lg bg-ink text-white flex items-center justify-center">
                <span class="material-symbols-outlined text-[20px]">folder_shared</span>
            </span>
            <span class="text-lg font-extrabold tracking-tight">AmbilFile</span>
        </a>
        <a href="/" class="text-sm font-semibold text-muted hover:text-ink flex items-center gap-1.5 transition-colors">
            <span class="material-symbols-outlined text-[20px]">arrow_back</span>
            <span class="hidden sm:inline">Beranda</span>
        </a>
    </div>
</header>

<!-- Main Content -->
<main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8" id="main-content">
    <div class="text-center py-16">
        <div class="animate-spin w-10 h-10 border-[3px] border-line border-t-brand-500 rounded-full mx-auto mb-4"></div>
        <p class="text-muted text-sm font-medium">Memuat ruangan...</p>
    </div>
</main>

<div class="max-w-6xl mx-auto px-4 sm:px-6 pb-8"></div>

<script>
let roomId = null;
let currentRoom = null;
let currentFiles = [];
let totalFilesInRoom = 0;
let currentView = 'list'; // 'list' or 'card'
let uploadAbortController = null;
let uploadStartTime = null;
let uploadedBytes = 0;
let countdownInterval = null;

// Load room on page load
window.addEventListener('DOMContentLoaded', async () => {
    const urlParams = new URLSearchParams(window.location.search);
    roomId = urlParams.get('id');
    
    if (!roomId) {
        showInfoModal('Room ID tidak ditemukan');
        window.location.href = '/';
        return;
    }
    
    await loadRoom(roomId);
});

async function loadRoom(roomId) {
    try {
        const response = await fetch(`/api/room/${roomId}`);
        const data = await response.json();
        
        if (!data.room) {
            showErrorModal(
                'Room Tidak Ditemukan',
                'Room mungkin sudah kadaluarsa atau tidak pernah ada.'
            );
            return;
        }
        
        currentRoom = data.room;
        currentRoom.permission = data.permission || 'both';
        currentRoom.allow_delete = data.allow_delete !== false;
        // Update quota label
        if (data.quota_info && data.quota_info.label) {
            const ql = document.getElementById('quota-label');
            if (ql) ql.textContent = 'Maksimal ' + data.quota_info.label + ' total per ruangan';
        }
        await loadTotalFileCount();
        renderRoom();
        await loadRoomContent();
    } catch (error) {
        console.error('Error loading room:', error);
        showErrorModal(
            'Gagal Memuat Room',
            'Terjadi kesalahan saat memuat room. Silakan coba lagi.'
        );
    }
}

async function loadTotalFileCount() {
    try {
        const response = await fetch(`/api/room/${roomId}`);
        const data = await response.json();
        if (data.files) {
            totalFilesInRoom = data.files.length;
        }
    } catch (error) {
        console.error('Error loading total file count:', error);
        totalFilesInRoom = 0;
    }
}

function showErrorModal(title, message) {
    document.getElementById('error-title').textContent = title;
    document.getElementById('error-message').textContent = message;
    document.getElementById('error-modal').classList.remove('hidden');
}

function closeErrorModal() {
    document.getElementById('error-modal').classList.add('hidden');
    window.location.href = '/';
}

// Generic info modal — pengganti alert()
function showInfoModal(message, success = false) {
    const wrap = document.getElementById('info-icon-wrap');
    const icon = document.getElementById('info-icon');
    if (success) {
        wrap.className = 'w-14 h-14 bg-green-50 border border-green-100 rounded-2xl flex items-center justify-center mx-auto mb-4';
        icon.className = 'material-symbols-outlined text-3xl text-green-500';
        icon.textContent = 'check_circle';
    } else {
        wrap.className = 'w-14 h-14 bg-red-50 border border-red-100 rounded-2xl flex items-center justify-center mx-auto mb-4';
        icon.className = 'material-symbols-outlined text-3xl text-red-500';
        icon.textContent = 'error';
    }
    document.getElementById('info-message').textContent = message;
    document.getElementById('info-modal').classList.remove('hidden');
}

function closeInfoModal() {
    document.getElementById('info-modal').classList.add('hidden');
}

// Generic confirm modal — pengganti confirm()
let confirmCallback = null;
function showConfirmModal(message, yesLabel, onYes) {
    document.getElementById('confirm-message').textContent = message;
    document.getElementById('confirm-yes-btn').textContent = yesLabel || 'Hapus';
    confirmCallback = onYes;
    document.getElementById('confirm-modal').classList.remove('hidden');
}
function closeConfirmModal() {
    document.getElementById('confirm-modal').classList.add('hidden');
    confirmCallback = null;
}
document.addEventListener('DOMContentLoaded', () => {
    const yesBtn = document.getElementById('confirm-yes-btn');
    if (yesBtn) {
        yesBtn.addEventListener('click', () => {
            const cb = confirmCallback;
            closeConfirmModal();
            if (cb) cb();
        });
    }
});

                    <p class="text-2xl sm:text-4xl font-extrabold font-mono tracking-widest text-ink">${currentRoom.pin}</p>
                </div>
                <div class="text-center timer-pulse">
                    <p class="text-[11px] sm:text-xs font-semibold text-muted uppercase tracking-wide mb-1.5">Sisa Waktu</p>

        <!-- File List -->

            <!-- Navigation Bar with Back Button -->
            <div id="folder-nav-bar" class="hidden mb-4 pb-4 border-b border-line">

                    <button onclick="navigateBack()"

                    </button>
                    <div id="folder-path-display" class="flex items-center gap-1.5 text-sm font-semibold text-ink min-w-0 overflow-x-auto">

                    </div>
                </div>
            </div>

            <div class="flex flex-wrap justify-between items-center gap-3 mb-4">
                <h3 class="text-lg font-extrabold">File (${currentFiles.length})</h3>
                <div class="flex items-center gap-2.5">
                    <!-- View Toggle -->
                    <div class="flex bg-wash border border-line rounded-lg p-1">
                        <button onclick="switchView('list')" id="view-list-btn"
                                class="p-1.5 px-2.5 rounded-md bg-white shadow-card text-sm font-semibold transition-all text-ink">
                            <span class="material-symbols-outlined text-[20px] block">view_list</span>
                        </button>
                        <button onclick="switchView('card')" id="view-card-btn"

                        </button>
                    </div>
                    ${currentFiles.length > 0 ? `
                        <button onclick="downloadAllAsZip()"
                                class="flex items-center gap-1.5 px-3.5 py-2 bg-ink text-white rounded-lg hover:bg-black text-sm font-semibold transition-colors">
                            <span class="material-symbols-outlined text-[20px]">folder_zip</span>
                            <span class="hidden sm:inline">Unduh ZIP</span>
                        </button>
                    ` : ''}
                </div>
            </div>
            
            <!-- Upload Progress (Inline) -->
            <div id="upload-progress-inline" class="hidden mb-4 p-4 bg-brand-50 border border-brand-100 rounded-xl">
                <div class="flex justify-between items-center mb-3 gap-2">
                    <div class="flex items-center gap-2 min-w-0">
                        <div class="spinner w-5 h-5 border-[3px] border-brand-200 border-t-brand-500 rounded-full shrink-0"></div>
                        <span class="font-semibold text-ink text-sm truncate">Mengupload <span id="upload-total-text">0/0</span>...</span>
                    </div>
                    <div class="flex items-center gap-3 shrink-0">
                        <button onclick="toggleSelectAllUpload()" class="text-brand-600 hover:text-brand-700 font-semibold text-sm">
                            Pilih semua
                        </button>
                        <button onclick="cancelUpload()" class="text-red-600 hover:text-red-700 font-semibold text-sm">
                            Batal
                        </button>
                    </div>
                </div>
                <div id="upload-queue-list" class="space-y-2 max-h-60 overflow-y-auto">
                    <!-- File items will be inserted here -->
                </div>
            </div>

            <!-- Batch Actions Bar -->
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4 p-3 bg-wash rounded-xl border border-line">
                <div class="flex items-center gap-3.5">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="select-all"

                    </label>

                <div class="flex gap-2">
                    <button onclick="openCreateFolderModal()"

                        Unduh
                    </button>
                </div>
            </div>

            <div id="file-list" class="space-y-2.5">
                ${currentFiles.length === 0 ? 
                    '<p class="text-center text-muted py-10 text-sm">Belum ada file yang diupload</p>' :
                    currentFiles.map(file => createFileCard(file)).join('')
                }

        </div>
        
        <!-- Download Progress (Fixed Bottom) -->
        <div id="download-progress" class="hidden fixed bottom-20 md:bottom-6 right-4 md:right-6 left-4 md:left-auto bg-white rounded-2xl shadow-pop p-5 border border-line md:w-96 max-h-[60vh] overflow-hidden flex flex-col z-50">
            <div class="flex justify-between items-center mb-3 gap-2">
                <h4 class="font-bold text-sm flex items-center gap-2 min-w-0">
                    <div class="spinner w-5 h-5 border-[3px] border-brand-200 border-t-brand-500 rounded-full shrink-0"></div>
                    <span class="truncate">Mengunduh <span id="download-total-text">0/0</span>...</span>
                </h4>
                <div class="flex items-center gap-3 shrink-0">
                    <button onclick="toggleSelectAllDownload()" class="text-brand-600 hover:text-brand-700 font-semibold text-sm">
                        Semua
                    </button>
                    <button onclick="cancelDownload()" class="text-muted hover:text-ink p-1">
                        <span class="material-symbols-outlined text-[20px]">close</span>
                    </button>
                </div>
            </div>
            <div id="download-queue-list" class="space-y-2 overflow-y-auto flex-1">
                <!-- File items will be inserted here -->
            </div>
        </div>

        <!-- Error Modal -->
        <div id="error-modal" class="hidden fixed inset-0 bg-ink/50 z-[60] flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-pop max-w-md w-full p-8 text-center">
                <div class="w-16 h-16 bg-red-50 border border-red-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <span class="material-symbols-outlined text-4xl text-red-500">error</span>

                    Room Tidak Ditemukan

                </p>

                        class="w-full py-3 bg-ink text-white rounded-lg font-semibold hover:bg-black transition-colors">
                    Kembali ke Beranda

                    <button id="confirm-yes-btn" class="flex-1 py-3 bg-red-500 text-white rounded-lg font-semibold hover:bg-red-600 transition-colors">Hapus</button>
                </div>
            </div>
        </div>
        <!-- Generic Info Modal (pengganti alert) -->

            <div class="bg-white rounded-2xl shadow-pop max-w-sm w-full p-6 text-center">

                            <p class="text-sm font-medium text-ink">Izinkan download</p>

                </div>

        </div>

        <!-- Create Folder Modal -->
        <div id="create-folder-modal" class="hidden fixed inset-0 bg-ink/50 z-[60] flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-pop max-w-md w-full p-6 sm:p-8">
                <div class="flex justify-between items-center mb-5">
                    <h3 class="text-xl font-extrabold text-ink">Buat Folder</h3>
                    <button onclick="closeCreateFolderModal()" class="text-muted hover:text-ink p-1">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-ink">Nama folder</label>
                        <input type="text"
                               id="folder-name-input"
                               placeholder="cth: Dokumen"
                               class="field w-full px-4 py-3 border border-line rounded-lg text-[15px]">
                    </div>
                    <div class="flex gap-3">
                        <button onclick="closeCreateFolderModal()"
                                class="flex-1 py-3 border border-line text-ink rounded-lg font-semibold hover:border-ink transition-colors">
                            Batal
                        </button>
                        <button onclick="createFolder()"
                                class="flex-1 py-3 bg-brand-500 text-white rounded-lg font-semibold hover:bg-brand-600 transition-colors">
                            Buat
                        </button>
                    </div>
                </div>
            </div>
        </div>
    `;
    
    // Start countdown timer
    startCountdownTimer();
}

async function setRoomPermission(perm) {
    try {
        const res = await fetch(`/api/room/${currentRoom.id}/settings`, {
            method: 'PUT',

// Countdown Timer
function startCountdownTimer() {
    if (countdownInterval) clearInterval(countdownInterval);
    
    updateCountdown();
    countdownInterval = setInterval(updateCountdown, 1000);
}

function updateCountdown() {
    const expiresAt = new Date(currentRoom.expires_at);
    const now = new Date();
    const diff = expiresAt - now;
    
    if (diff <= 0) {
        document.getElementById('countdown-timer').innerHTML = '<span class="text-red-600">EXPIRED</span>';
        clearInterval(countdownInterval);
        setTimeout(() => {
            showErrorModal(
                'Room Telah Kadaluarsa',
                'Waktu room telah habis. Semua file akan dihapus dari server.'
            );
        }, 1000);
        return;
    }
    
    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((diff % (1000 * 60)) / 1000);
    
    let displayText = '';
    let colorClass = 'text-gray-800';
    
    if (days > 0) {
        displayText = `${days}<span class="text-sm">D</span> ${hours}<span class="text-sm">H</span>`;
    } else if (hours > 0) {
        displayText = `${hours}<span class="text-sm">H</span> ${minutes}<span class="text-sm">M</span>`;
        if (hours < 1) colorClass = 'text-orange-600';
    } else if (minutes > 0) {
        displayText = `${minutes}<span class="text-sm">M</span> ${seconds}<span class="text-sm">S</span>`;
        colorClass = 'text-orange-600';
    } else {
        displayText = `${seconds}<span class="text-sm">S</span>`;
        colorClass = 'text-red-600';
    }
    
    document.getElementById('countdown-timer').innerHTML = `<span class="${colorClass}">${displayText}</span>`;
}

function formatFileSize(bytes) {
    if (bytes === 0) return '0 B';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
}

        'jpg': '🖼️', 'jpeg': '🖼️', 'png': '🖼️', 'gif': '🖼️', 'webp': '🖼️',
        'mp4': '🎥', 'mov': '🎥', 'avi': '🎥',

        'zip': '🗜️', 'rar': '🗜️',

    };
    return icons[ext] || '📦';
}

async function uploadFileInChunks(file, fileId, roomId, onProgress) {
    const chunkSize = 10 * 1024 * 1024; // 10MB (increased for faster upload)
    const totalChunks = Math.ceil(file.size / chunkSize);
    let totalUploaded = 0;
    let speedMbps = 0;
    
    for (let i = 0; i < totalChunks; i++) {
        if (uploadAbortController.signal.aborted) {
            throw new Error('Upload cancelled');
        }
        
        const start = i * chunkSize;
        const end = Math.min(start + chunkSize, file.size);
        const chunk = file.slice(start, end);
        
        const formData = new FormData();
        formData.append('file', chunk);
        formData.append('chunkIndex', i);
        formData.append('totalChunks', totalChunks);
        formData.append('fileId', fileId);
        formData.append('originalName', file.name);
        formData.append('mimeType', file.type);
        formData.append('totalSize', file.size);
        formData.append('folderId', currentFolderId || '');
        
        const chunkStart = performance.now();
        const response = await fetch(`/api/upload/${roomId}`, {
            method: 'POST',
            body: formData,
            signal: uploadAbortController.signal
        });
        const chunkSecs = Math.max((performance.now() - chunkStart) / 1000, 0.01);
        // Mbps = (bytes * 8) / (seconds * 1e6), smoothed
        const instMbps = (chunk.size * 8) / (chunkSecs * 1e6);
        speedMbps = speedMbps === 0 ? instMbps : speedMbps * 0.7 + instMbps * 0.3;
        
        if (!response.ok) {
            let msg = 'Upload failed';
            try {
                const errData = await response.json();
                if (errData.error) msg = errData.error;
            } catch {}
            throw new Error(msg);
        }
        
        totalUploaded += chunk.size;
        const progress = Math.round(((i + 1) / totalChunks) * 100);
        onProgress(progress, totalUploaded, speedMbps);
    }
}

    if (uploadAbortController) {
        uploadAbortController.abort();
        document.getElementById('upload-progress-inline').classList.add('hidden');
    }
}

        if (!cb.disabled) {
            cb.checked = !allChecked;
        }
    });
}

function formatSpeed(bytesPerSecond) {
    if (bytesPerSecond < 1024) {
        return Math.round(bytesPerSecond) + ' B/s';
    } else if (bytesPerSecond < 1024 * 1024) {
        return (bytesPerSecond / 1024).toFixed(1) + ' KB/s';
    } else {
        return (bytesPerSecond / 1024 / 1024).toFixed(2) + ' MB/s';
    }
}

async function deleteFile(fileId) {
    showConfirmModal('Yakin ingin menghapus file ini?', 'Hapus', async () => {
    
    try {
        const response = await fetch(`/api/file/${fileId}`, {
            method: 'DELETE'
        });
        
        if (response.ok) {
            await loadTotalFileCount();
            await loadRoomContent();
            updateTotalFileDisplay();
        } else {
            showInfoModal('Gagal menghapus file');
        }
    } catch (error) {
        console.error('Delete error:', error);
        showInfoModal('Gagal menghapus file');
    }
    });
}

function generateUUID() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        const r = Math.random() * 16 | 0;
        const v = c == 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
    });
}

// ============================================
// MULTI-SELECT FUNCTIONALITY
// ============================================

let selectedFiles = new Set();

function toggleFileSelection(fileId) {
    if (selectedFiles.has(fileId)) {
        selectedFiles.delete(fileId);
    } else {
        selectedFiles.add(fileId);
    }
    updateSelectionUI();
}

function toggleSelectAll() {
    const selectAllCheckbox = document.getElementById('select-all');
    const fileCheckboxes = document.querySelectorAll('.file-checkbox');
    
    if (selectAllCheckbox.checked) {
        // Select all
        selectedFiles.clear();
        currentFiles.forEach(file => selectedFiles.add(file.id));
        fileCheckboxes.forEach(cb => cb.checked = true);
    } else {
        // Deselect all
        selectedFiles.clear();
        fileCheckboxes.forEach(cb => cb.checked = false);
    }
    
    updateSelectionUI();
}

function updateSelectionUI() {
    const count = selectedFiles.size;
    const countEl = document.getElementById('selected-count');
    const downloadBtn = document.getElementById('download-selected-btn');
    const selectAllCheckbox = document.getElementById('select-all');
    
    // Update count
    countEl.textContent = `${count} dipilih`;
    
    // Update button state
    if (count > 0) {
        downloadBtn.disabled = false;
        downloadBtn.innerHTML = `<span class="material-symbols-outlined text-[20px]">download</span> Unduh ${count}`;
    } else {
        downloadBtn.disabled = true;
        downloadBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">download</span> Unduh';
    }
    
    // Update select all checkbox
    if (count === 0) {
        selectAllCheckbox.checked = false;
        selectAllCheckbox.indeterminate = false;
    } else if (count === currentFiles.length) {
        selectAllCheckbox.checked = true;
        selectAllCheckbox.indeterminate = false;
    } else {
        selectAllCheckbox.checked = false;
        selectAllCheckbox.indeterminate = true;
    }
    
    // Update visual selection state on cards
    document.querySelectorAll('.file-item').forEach(card => {
        const fileId = card.getAttribute('data-file-id');
        if (selectedFiles.has(fileId)) {
            card.classList.add('ring-2', 'ring-brand-500', 'border-brand-500');
        } else {
            card.classList.remove('ring-2', 'ring-brand-500', 'border-brand-500');
        }
    });
}

function getSelectedFiles() {
    return currentFiles.filter(file => selectedFiles.has(file.id));
}

async function downloadSelected() {
    const selected = getSelectedFiles();
    
    if (selected.length === 0) {
        showInfoModal('Pilih file terlebih dahulu');
        return;
    }
    
    if (selected.length === 1) {
        // Single file - direct download
        window.location.href = `/d/${selected[0].id}`;
        return;
    }
    
    // Multiple files - download as ZIP
    try {
        const zip = new JSZip();
        const progressEl = document.getElementById('download-progress');
        const progressBar = document.getElementById('download-bar');
        const progressText = document.getElementById('download-text');
        
        progressEl.classList.remove('hidden');
        let completed = 0;
        
        for (const file of selected) {
            const response = await fetch(`/d/${file.id}`);
            const blob = await response.blob();
            zip.file(file.original_name, blob);
            
            completed++;
            const percent = Math.round((completed / selected.length) * 100);
            progressBar.style.width = `${percent}%`;
            progressText.textContent = `${percent}% - ${completed}/${selected.length} files`;
        }
        
        const zipBlob = await zip.generateAsync({ type: 'blob' });
        const url = URL.createObjectURL(zipBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `selected-files-${Date.now()}.zip`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        
        progressEl.classList.add('hidden');
        
        // Clear selection after download
        selectedFiles.clear();
        document.querySelectorAll('.file-checkbox').forEach(cb => cb.checked = false);
        updateSelectionUI();
        
    } catch (error) {
        console.error('Download error:', error);
        showInfoModal('Gagal mendownload file');
        document.getElementById('download-progress').classList.add('hidden');
    }
}

// ============================================
// FOLDER FUNCTIONALITY
// ============================================

let currentFolderId = null;
let currentFolders = [];
let folderPath = []; // [{id: 'xxx', name: 'Folder Name'}]

function openCreateFolderModal() {
    document.getElementById('create-folder-modal').classList.remove('hidden');
    document.getElementById('folder-name-input').value = '';
    document.getElementById('folder-name-input').focus();
}

function closeCreateFolderModal() {
    document.getElementById('create-folder-modal').classList.add('hidden');
}

async function createFolder() {
    const folderName = document.getElementById('folder-name-input').value.trim();
    
    if (!folderName) {
        showInfoModal('Nama folder tidak boleh kosong');
        return;
    }
    
    try {
        const response = await fetch(`/api/folder/create/${roomId}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: folderName,
                parent_id: currentFolderId || ''
            })
        });
        
        const data = await response.json();
        
        if (data.success) {
            closeCreateFolderModal();
            await loadRoomContent();
        } else {
            showInfoModal('Gagal membuat folder');
        }
    } catch (error) {
        console.error('Create folder error:', error);
        showInfoModal('Gagal membuat folder');
    }
}

async function loadRoomContent() {
    await Promise.all([loadFolders(), loadFiles()]);
    displayContent();
}

async function loadFolders() {
    try {
        const url = currentFolderId 
            ? `/api/folders/${roomId}?parent_id=${currentFolderId}`
            : `/api/folders/${roomId}`;
        
        const response = await fetch(url);
        const data = await response.json();
        
        if (data.success) {
            currentFolders = data.folders || [];
        }
    } catch (error) {
        console.error('Load folders error:', error);
    }
}

async function loadFiles() {
    try {
        const url = currentFolderId
            ? `/api/room/${roomId}?folder_id=${currentFolderId}`
            : `/api/room/${roomId}`;
        
        const response = await fetch(url);
        const data = await response.json();
        
        if (data.room) {
            currentFiles = data.files || [];
        }
    } catch (error) {
        console.error('Load files error:', error);
    }
}

function displayContent() {
    const fileListEl = document.getElementById('file-list');
    
    let html = '';
    
    if (currentFolders.length === 0 && currentFiles.length === 0) {
        html = '<p class="text-center text-muted py-10 text-sm">Belum ada file atau folder</p>';
    } else {
        if (currentFolders.length > 0) {
            html += currentFolders.map(folder => createFolderCard(folder)).join('');
        }
        if (currentFiles.length > 0) {
            html += currentFiles.map(file => createFileCard(file)).join('');
        }
    }
    
    fileListEl.innerHTML = html;
    renderBreadcrumb();
}

function createFolderCard(folder) {
    if (currentView === 'card') {
        return `
            <div class="file-item bg-white border border-line rounded-xl overflow-hidden hover:shadow-card hover:border-muted transition-all cursor-pointer"
                 onclick="openFolder('${folder.id}', '${folder.name}')">
                <div class="aspect-[16/10] bg-brand-50 flex items-center justify-center border-b border-brand-100">
                    <span class="material-symbols-outlined text-6xl text-brand-500">folder</span>
                </div>
                <div class="p-3.5 flex items-center gap-2">
                    <div class="flex-1 min-w-0">
                        <h4 class="font-semibold text-ink text-[14px] truncate">${folder.name}</h4>
                        <p class="text-xs text-muted mt-0.5">${new Date(folder.created_at).toLocaleString('id-ID')}</p>
                    </div>
                    <button onclick="event.stopPropagation(); deleteFolder('${folder.id}')"
                            class="p-2 text-muted hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors shrink-0"
                            aria-label="Hapus folder">
                        <span class="material-symbols-outlined text-[20px] block">delete</span>
                    </button>
                </div>
            </div>
        `;
    } else {
        return `
            <div class="file-item bg-white border border-line rounded-xl hover:border-muted hover:shadow-card transition-all cursor-pointer"
                 onclick="openFolder('${folder.id}', '${folder.name}')">
                <div class="flex items-center gap-3.5 p-3.5">
                    <div class="w-11 h-11 bg-brand-50 border border-brand-100 rounded-lg flex items-center justify-center shrink-0">
                        <span class="material-symbols-outlined text-[28px] text-brand-500">folder</span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <h4 class="font-semibold text-ink text-[15px] truncate">${folder.name}</h4>
                        <p class="text-[13px] text-muted mt-0.5">${new Date(folder.created_at).toLocaleString('id-ID')}</p>
                    </div>
                    <button onclick="event.stopPropagation(); deleteFolder('${folder.id}')"
                            class="p-2 text-muted hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors shrink-0"
                            aria-label="Hapus folder">
                        <span class="material-symbols-outlined text-[20px] block">delete</span>
                    </button>
                </div>
            </div>
        `;
    }
}

function openFolder(folderId, folderName = 'Folder') {
    navigateToFolder(folderId, folderName);
}

function navigateToFolder(folderId, folderName) {
    folderPath.push({ id: folderId, name: folderName });
    currentFolderId = folderId;
    loadRoomContent();
    renderBreadcrumb();
}

function navigateBack() {
    if (folderPath.length > 0) {
        folderPath.pop();
        currentFolderId = folderPath.length > 0 ? folderPath[folderPath.length - 1].id : null;
        loadRoomContent();
        renderBreadcrumb();
    }
}

function navigateToRoot() {
    folderPath = [];
    currentFolderId = null;
    loadRoomContent();
    renderBreadcrumb();
}

function renderBreadcrumb() {
    const navBar = document.getElementById('folder-nav-bar');
    const pathDisplay = document.getElementById('folder-path-display');
    
    if (folderPath.length === 0) {
        navBar.classList.add('hidden');
        return;
    }
    
    navBar.classList.remove('hidden');
    
    let pathHTML = `
        <button onclick="navigateToRoot()" class="text-brand-600 hover:text-brand-700 font-semibold">
            <span class="material-symbols-outlined text-lg align-middle">home</span>
        </button>
    `;
    
    folderPath.forEach((folder, index) => {
        const isLast = index === folderPath.length - 1;
        if (isLast) {
            pathHTML += `
                <span class="text-gray-400">/</span>
                <span class="text-gray-800 font-semibold">${folder.name}</span>
            `;
        } else {
            pathHTML += `
                <span class="text-gray-400">/</span>
                <button onclick="navigateToFolder('${folder.id}', '${folder.name}')" 
                        class="text-brand-600 hover:text-brand-700">${folder.name}</button>
            `;
        }
    });
    
    pathDisplay.innerHTML = pathHTML;
}

async function deleteFolder(folderId) {
    showConfirmModal('Hapus folder ini? Semua file dan subfolder di dalamnya akan ikut terhapus.', 'Hapus', async () => {
    
    try {
        const response = await fetch(`/api/folder/${folderId}`, {
            method: 'DELETE'
        });
        
        const data = await response.json();
        
        if (data.success) {
            await loadTotalFileCount();
            await loadRoomContent();
            updateTotalFileDisplay();
        } else {
            showInfoModal('Gagal menghapus folder');
        }
    } catch (error) {
        console.error('Delete folder error:', error);
        showInfoModal('Gagal menghapus folder');
    }
    });
}

function openShareModal() {
    if (!currentRoom) return;
    document.getElementById('share-link-input').value = window.location.href;
    
    const pin = currentRoom.pin || 'N/A';
    const expiry = currentRoom.expires_at ? new Date(currentRoom.expires_at).toLocaleString('id-ID') : 'N/A';
    document.getElementById('share-room-info').innerHTML = `
        <p><span class="font-medium text-ink">PIN:</span> ${pin}</p>
        <p><span class="font-medium text-ink">Kadaluarsa:</span> ${expiry}</p>
    `;
    
    renderShareSettings();
    document.getElementById('share-modal').classList.remove('hidden');
}

function closeShareModal() {
    document.getElementById('share-modal').classList.add('hidden');
}

function renderShareSettings() {
    const perm = currentRoom.permission || 'both';
    const allowDel = currentRoom.allow_delete !== false;
    const canDownload = perm !== 'view';
    
    // Permission buttons
    const permBtns = document.getElementById('share-perm-btns');
    const perms = [
        {val: 'both', label: 'Lihat + Download'},
        {val: 'view', label: 'Lihat saja'},
        {val: 'download', label: 'Download saja'},
    ];
    permBtns.innerHTML = perms.map(p => `
        <button onclick="setRoomPermission('${p.val}')"
                class="px-4 py-2 rounded-lg text-sm font-medium transition-colors ${perm === p.val ? 'bg-brand-500 text-white' : 'bg-slate-100 text-ink'}">
            ${p.label}
        </button>
    `).join('');
    
    // Delete toggle
    const delToggle = document.getElementById('share-delete-toggle');
    const delKnob = document.getElementById('share-delete-knob');
    delToggle.className = `w-12 h-7 rounded-full transition-colors relative shrink-0 ${allowDel ? 'bg-brand-500' : 'bg-slate-300'}`;
    delKnob.className = `absolute top-1 w-5 h-5 bg-white rounded-full shadow transition-all ${allowDel ? 'right-1' : 'left-1'}`;
    
    // Download toggle
    const dlToggle = document.getElementById('share-download-toggle');
    const dlKnob = document.getElementById('share-download-knob');
    dlToggle.className = `w-12 h-7 rounded-full transition-colors relative shrink-0 ${canDownload ? 'bg-brand-500' : 'bg-slate-300'}`;
    dlKnob.className = `absolute top-1 w-5 h-5 bg-white rounded-full shadow transition-all ${canDownload ? 'right-1' : 'left-1'}`;
}

async function copyShareLink() {
    const input = document.getElementById('share-link-input');
    try {
        await navigator.clipboard.writeText(input.value);
    } catch (err) {
        input.select();
        document.execCommand('copy');
    }
    closeShareModal();
    showInfoModal('Link ruangan berhasil disalin ke clipboard!', true);
}

async function toggleDownloadPermission() {
    const current = currentRoom.permission || 'both';
    // Toggle between 'both' and 'view'
    const newPerm = current === 'view' ? 'both' : 'view';
    await setRoomPermission(newPerm);
}

    openShareModal();

function showRoomInfo() {
    openShareModal();
