<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room - AmbilFile</title>
    <link rel="stylesheet" href="/dist-output.css?v=20261006c">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">
    <link rel="stylesheet" href="/css/room.css">
    
    <script src="/js/api.js"></script>
</head>
<body class="bg-wash text-ink">

<!-- Header -->
<header class="bg-white border-b border-line sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
        <a href="/" class="flex items-center gap-2">
            <span class="w-8 h-8 rounded-lg bg-ink text-white flex items-center justify-center">
                <span class="material-symbols-outlined text-[20px]">folder_shared</span>
            </span>
            <span class="text-lg font-extrabold tracking-tight">AmbilFile</span>
        </a>
        <div class="flex items-center gap-2">
            <!-- Desktop actions -->
            <button onclick="document.getElementById('upload-area')?.scrollIntoView({behavior:'smooth'});document.getElementById('file-input')?.click()" class="hidden md:inline-flex items-center gap-2 px-4 py-2 bg-brand-500 text-white rounded-lg text-sm font-semibold hover:bg-brand-600 transition-colors">
                <span class="material-symbols-outlined text-[20px]">upload</span>
                Upload
            </button>
            <button onclick="openShareModal()" class="hidden md:inline-flex items-center gap-2 px-4 py-2 bg-white border border-line text-ink rounded-lg text-sm font-semibold hover:bg-wash transition-colors">
                <span class="material-symbols-outlined text-[20px]">share</span>
                Bagikan
            </button>
            <button onclick="openShareModal()" class="hidden md:inline-flex items-center gap-2 px-4 py-2 bg-white border border-line text-ink rounded-lg text-sm font-semibold hover:bg-wash transition-colors">
                <span class="material-symbols-outlined text-[20px]">info</span>
                Info
            </button>
            <a href="/" data-home-link class="text-sm font-semibold text-muted hover:text-ink flex items-center gap-1.5 transition-colors ml-2">
                <span class="material-symbols-outlined text-[20px]">arrow_back</span>
                <span class="hidden sm:inline">Beranda</span>
            </a>
        </div>
    </div>
</header>

<!-- Main Content -->
<main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8" id="main-content">
    <div class="text-center py-16">
        <div class="animate-spin w-10 h-10 border-[3px] border-line border-t-brand-500 rounded-full mx-auto mb-4"></div>
        <p class="text-muted text-sm font-medium">Memuat ruangan...</p>
    </div>
</main>

<div class="max-w-6xl mx-auto px-4 sm:px-6 pb-8"></div>



<!-- Mobile Bottom Navigation -->
<nav class="bottom-nav md:hidden">
    <div class="flex items-center justify-around max-w-md mx-auto">
        <a href="/" data-home-link class="bottom-nav-item">
            <span class="material-symbols-outlined">home</span>
            <span>Home</span>
        </a>
        <button onclick="document.getElementById('upload-area')?.scrollIntoView({behavior:'smooth'});document.getElementById('file-input')?.click()" class="bottom-nav-item bg-transparent border-0 active">
            <span class="material-symbols-outlined">upload</span>
            <span>Upload</span>
        </button>
        <button onclick="openShareModal()" class="bottom-nav-item border-0 bg-transparent">
            <span class="material-symbols-outlined">share</span>
            <span>Bagikan</span>
        </button>
        <button onclick="openShareModal()" class="bottom-nav-item border-0 bg-transparent">
            <span class="material-symbols-outlined">info</span>
            <span>Info</span>
        </button>
    </div>
</nav>

    <script src="/js/room/room.js?v=20261006e"></script>
    <script src="/js/room/render.js?v=20261006e"></script>
    <script src="/js/room/countdown.js"></script>
    <script src="/js/room/modals.js?v=20261006f"></script>
    <script src="/js/room/upload.js?v=4"></script>
    <script src="/js/room/files.js"></script>
    <script src="/js/room/download.js"></script>
    <script src="/js/room/folders.js"></script>
    <script src="/js/room/settings.js"></script>
</body>
</html>
