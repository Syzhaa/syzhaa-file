<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room - Syzhaa File</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap" rel="stylesheet">
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; }
        .drag-over { border-color: #004ac6 !important; background: rgba(0, 74, 198, 0.05); }
        @keyframes pulse-timer { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .timer-pulse { animation: pulse-timer 2s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { animation: spin 1s linear infinite; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#7C3AED",
                        "primary-fixed": "#EDE9FE"
                    },
                    fontFamily: {
                        "headline": ["Sora"],
                        "body": ["Inter"]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-body">

<!-- Header -->
<header class="bg-white border-b border-gray-200 shadow-sm">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
        <h1 class="text-2xl font-headline font-bold text-primary">Syzhaa File</h1>
        <a href="/" class="text-primary hover:underline text-sm font-semibold">
            ← Kembali ke Beranda
        </a>
    </div>
</header>

<!-- Main Content -->
<main class="max-w-6xl mx-auto px-6 py-8" id="main-content">
    <div class="text-center py-12">
        <div class="animate-spin w-12 h-12 border-4 border-primary border-t-transparent rounded-full mx-auto mb-4"></div>
        <p class="text-gray-600">Loading room...</p>
    </div>
</main>

<script>
let roomId = null;
let currentRoom = null;
let currentFiles = [];
let totalFilesInRoom = 0;
let currentView = 'list'; // 'list' or 'card'
let uploadAbortController = null;
let uploadStartTime = null;
let uploadedBytes = 0;

// Load room on page load
window.addEventListener('DOMContentLoaded', async () => {
    const urlParams = new URLSearchParams(window.location.search);
    roomId = urlParams.get('id');
    
    if (!roomId) {
        alert('Room ID tidak ditemukan');
        window.location.href = '/';
        return;
    }
    
    await loadRoom(roomId);
});

async function loadRoom(roomId) {
    try {
        const response = await fetch(`/api/room/${roomId}`);
        const data = await response.json();
        
        if (!data.room) {
            showErrorModal(
                'Room Tidak Ditemukan',
                'Room mungkin sudah kadaluarsa atau tidak pernah ada.'
            );
            return;
        }
        
        currentRoom = data.room;
        await loadTotalFileCount();
        renderRoom();
        await loadRoomContent();
    } catch (error) {
        console.error('Error loading room:', error);
        showErrorModal(
            'Gagal Memuat Room',
            'Terjadi kesalahan saat memuat room. Silakan coba lagi.'
        );
    }
}

async function loadTotalFileCount() {
    try {
        const response = await fetch(`/api/room/${roomId}`);
        const data = await response.json();
        if (data.files) {
            totalFilesInRoom = data.files.length;
        }
    } catch (error) {
        console.error('Error loading total file count:', error);
        totalFilesInRoom = 0;
    }
}

function showErrorModal(title, message) {
    document.getElementById('error-title').textContent = title;
    document.getElementById('error-message').textContent = message;
    document.getElementById('error-modal').classList.remove('hidden');
}

function closeErrorModal() {
    document.getElementById('error-modal').classList.add('hidden');
    window.location.href = '/';
}

function renderRoom() {
    const mainContent = document.getElementById('main-content');
    mainContent.innerHTML = `
        <!-- Room Info -->
        <div class="bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-200 rounded-2xl p-6 mb-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="text-center">
                    <p class="text-sm text-gray-600 mb-1">PIN Akses</p>
                    <p class="text-4xl font-bold font-mono text-primary">${currentRoom.pin}</p>
                </div>
                <div class="text-center timer-pulse">
                    <p class="text-sm text-gray-600 mb-1">⏱️ Waktu Tersisa</p>
                    <div id="countdown-timer" class="text-2xl font-semibold text-gray-800">
                        <span class="text-red-500">Loading...</span>
                    </div>
                </div>
                <div class="text-center">
                    <p class="text-sm text-gray-600 mb-1">Total File</p>
                    <p class="text-2xl font-semibold text-gray-800" id="total-files-count">${totalFilesInRoom}</p>
                </div>
            </div>
            <div class="mt-6 pt-6 border-t border-blue-200">
                <p class="text-sm text-gray-600 mb-2">Link Berbagi:</p>
                <div class="flex gap-2">
                    <input type="text" readonly 
                           value="${window.location.href}"
                           class="flex-1 px-4 py-2 bg-white border border-gray-300 rounded-lg text-sm font-mono"
                           onclick="this.select()">
                    <button onclick="copyLink()"
                            class="px-6 py-2 bg-primary text-white rounded-lg hover:bg-blue-700 text-sm font-semibold">
                        Salin
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Upload Area -->
        <div class="bg-white border-2 border-dashed border-gray-300 rounded-2xl p-12 mb-8 text-center hover:border-primary transition-all cursor-pointer"
             id="upload-area"
             ondrop="handleDrop(event)"
             ondragover="handleDragOver(event)"
             ondragleave="handleDragLeave(event)"
             onclick="document.getElementById('file-input').click()">
            <span class="material-symbols-outlined text-6xl text-gray-400 mb-4 block">cloud_upload</span>
            <h3 class="text-xl font-headline font-semibold mb-2">Upload File</h3>
            <p class="text-gray-600 mb-4">Drag & drop file atau klik untuk memilih</p>
            <input type="file" id="file-input" multiple class="hidden" onchange="handleFileSelect(event)">
            <p class="text-xs text-gray-500 mt-4">Maksimal 5GB total per ruangan</p>
        </div>
        
        <!-- File List -->
        <div class="bg-white rounded-2xl border border-gray-200 p-6">
            <!-- Navigation Bar with Back Button -->
            <div id="folder-nav-bar" class="hidden mb-4 pb-4 border-b border-gray-200">
                <div class="flex items-center gap-3">
                    <button onclick="navigateBack()" 
                            class="flex items-center gap-2 px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg transition-all">
                        <span class="material-symbols-outlined text-lg">arrow_back</span>
                        <span class="font-semibold text-sm">Back</span>
                    </button>
                    <div id="folder-path-display" class="flex items-center gap-2 text-sm font-semibold text-gray-700">
                        <!-- Path will be inserted here -->
                    </div>
                </div>
            </div>
            
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-headline font-semibold">File (${currentFiles.length})</h3>
                <div class="flex items-center gap-3">
                    <!-- View Toggle -->
                    <div class="flex bg-gray-100 rounded-lg p-1">
                        <button onclick="switchView('list')" id="view-list-btn" 
                                class="px-3 py-1 rounded bg-white shadow text-sm font-semibold transition-all">
                            <span class="material-symbols-outlined text-lg">view_list</span>
                        </button>
                        <button onclick="switchView('card')" id="view-card-btn"
                                class="px-3 py-1 rounded text-sm font-semibold transition-all">
                            <span class="material-symbols-outlined text-lg">grid_view</span>
                        </button>
                    </div>
                    ${currentFiles.length > 0 ? `
                        <button onclick="downloadAllAsZip()" 
                                class="flex items-center gap-2 px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 text-sm font-semibold transition-all">
                            <span class="material-symbols-outlined text-lg">folder_zip</span>
                            Download All (ZIP)
                        </button>
                    ` : ''}
                </div>
            </div>
            
            <!-- Upload Progress (Inline) -->
            <div id="upload-progress-inline" class="hidden mb-4 p-4 bg-blue-50 border border-blue-200 rounded-lg">
                <div class="flex justify-between items-center mb-3">
                    <div class="flex items-center gap-2">
                        <div class="spinner w-5 h-5 border-3 border-blue-600 border-t-transparent rounded-full"></div>
                        <span class="font-semibold text-blue-900">Uploading <span id="upload-total-text">0/0</span> files...</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="toggleSelectAllUpload()" class="text-blue-600 hover:underline font-semibold text-sm">
                            Select All
                        </button>
                        <button onclick="cancelUpload()" class="text-red-600 hover:text-red-700 font-semibold text-sm">
                            Cancel
                        </button>
                    </div>
                </div>
                <div id="upload-queue-list" class="space-y-2 max-h-60 overflow-y-auto">
                    <!-- File items will be inserted here -->
                </div>
            </div>
            
            <!-- Batch Actions Bar -->
            <div class="flex items-center justify-between mb-4 p-3 bg-gray-50 rounded-xl border border-gray-200">
                <div class="flex items-center gap-4">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="select-all" 
                               onchange="toggleSelectAll()"
                               class="w-5 h-5 rounded border-gray-300 text-primary focus:ring-primary">
                        <span class="text-sm font-semibold text-gray-700">Pilih Semua</span>
                    </label>
                    <span id="selected-count" class="text-sm text-gray-600">0 dipilih</span>
                </div>
                <div class="flex gap-2">
                    <button onclick="openCreateFolderModal()" 
                            class="px-4 py-2 bg-green-600 text-white rounded-lg font-semibold hover:bg-green-700 transition-all flex items-center gap-2">
                        <span class="material-symbols-outlined text-lg">create_new_folder</span>
                        Buat Folder
                    </button>
                    <button id="download-selected-btn" 
                            onclick="downloadSelected()"
                            disabled
                            class="px-4 py-2 bg-primary text-white rounded-lg font-semibold hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition-all flex items-center gap-2">
                        <span class="material-symbols-outlined text-lg">download</span>
                        Download Terpilih
                    </button>
                </div>
            </div>
            
            <div id="file-list" class="space-y-3">
                ${currentFiles.length === 0 ? 
                    '<p class="text-center text-gray-500 py-8">Belum ada file yang diupload</p>' :
                    currentFiles.map(file => createFileCard(file)).join('')
                }
            </div>
        </div>
        
        <!-- Download Progress (Fixed Bottom) -->
        <div id="download-progress" class="hidden fixed bottom-6 right-6 bg-white rounded-xl shadow-2xl p-6 border border-gray-200 w-96 max-h-[500px] overflow-hidden flex flex-col">
            <div class="flex justify-between items-center mb-3">
                <h4 class="font-semibold flex items-center gap-2">
                    <div class="spinner w-5 h-5 border-3 border-green-600 border-t-transparent rounded-full"></div>
                    <span>Downloading <span id="download-total-text">0/0</span> files...</span>
                </h4>
                <div class="flex items-center gap-2">
                    <button onclick="toggleSelectAllDownload()" class="text-green-600 hover:underline font-semibold text-sm">
                        Select All
                    </button>
                    <button onclick="cancelDownload()" class="text-red-600 hover:text-red-700">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>
            </div>
            <div id="download-queue-list" class="space-y-2 overflow-y-auto flex-1">
                <!-- File items will be inserted here -->
            </div>
        </div>
        
        <!-- Error Modal -->
        <div id="error-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 text-center">
                <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <span class="material-symbols-outlined text-5xl text-red-600">error</span>
                </div>
                <h3 id="error-title" class="text-2xl font-headline font-bold text-gray-800 mb-2">
                    Room Tidak Ditemukan
                </h3>
                <p id="error-message" class="text-gray-600 mb-6">
                    Room mungkin sudah kadaluarsa atau tidak pernah ada.
                </p>
                <button onclick="closeErrorModal()" 
                        class="w-full py-3 bg-primary text-white rounded-xl font-semibold hover:bg-blue-700 transition-all">
                    Kembali ke Beranda
                </button>
            </div>
        </div>
        
        <!-- Create Folder Modal -->
        <div id="create-folder-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-2xl font-headline font-bold text-gray-800">Buat Folder</h3>
                    <button onclick="closeCreateFolderModal()" class="text-gray-400 hover:text-gray-600">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-gray-700">Nama Folder</label>
                        <input type="text" 
                               id="folder-name-input" 
                               placeholder="Masukkan nama folder"
                               class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-primary focus:outline-none">
                    </div>
                    <div class="flex gap-3">
                        <button onclick="closeCreateFolderModal()" 
                                class="flex-1 py-3 bg-gray-100 text-gray-700 rounded-xl font-semibold hover:bg-gray-200 transition-all">
                            Batal
                        </button>
                        <button onclick="createFolder()" 
                                class="flex-1 py-3 bg-primary text-white rounded-xl font-semibold hover:bg-blue-700 transition-all">
                            Buat
                        </button>
                    </div>
                </div>
            </div>
        </div>
    `;
    
    // Start countdown timer
    startCountdownTimer();
}

function createFileCard(file) {
    if (currentView === 'card') {
        return createFileCardView(file);
    } else {
        return createFileListView(file);
    }
}

function createFileListView(file) {
    const fileSize = formatFileSize(file.size);
    const icon = getFileIcon(file.original_name);
    
    return `
        <div class="flex items-center gap-4 p-4 bg-gray-50 rounded-xl hover:bg-gray-100 transition-all">
            <div class="text-4xl">${icon}</div>
            <div class="flex-1 min-w-0">
                <h4 class="font-semibold text-gray-800 truncate">${file.original_name}</h4>
                <p class="text-sm text-gray-600">${fileSize} • ${file.downloads} downloads</p>
            </div>
            <div class="flex gap-2">
                <a href="/d/${file.id}" 
                   class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-blue-700 text-sm font-semibold"
                   download>
                    Download
                </a>
                <button onclick="deleteFile('${file.id}')"
                        class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 text-sm font-semibold">
                    Hapus
                </button>
            </div>
        </div>
    `;
}

function createFileCardView(file) {
    const fileSize = formatFileSize(file.size);
    const icon = getFileIcon(file.original_name);
    const isImage = isImageFile(file.original_name);
    const thumbnailUrl = isImage ? `/d/${file.id}` : null;
    
    return `
        <div class="file-item bg-white border border-gray-200 rounded-xl overflow-hidden hover:shadow-lg transition-all" data-file-id="${file.id}">
            <div class="aspect-video bg-gray-100 flex items-center justify-center relative overflow-hidden">
                <input type="checkbox" 
                       class="file-checkbox absolute top-3 left-3 w-5 h-5 rounded border-gray-300 text-primary focus:ring-primary z-10 cursor-pointer"
                       onchange="toggleFileSelection('${file.id}')">
                ${isImage ? 
                    `<img src="${thumbnailUrl}" 
                          alt="${file.original_name}" 
                          class="w-full h-full object-cover"
                          onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                     <div class="hidden w-full h-full items-center justify-center">
                         <span class="text-6xl">${icon}</span>
                     </div>` :
                    `<span class="text-6xl">${icon}</span>`
                }
            </div>
            <div class="p-4">
                <h4 class="font-semibold text-gray-800 truncate mb-1">${file.original_name}</h4>
                <p class="text-xs text-gray-600 mb-3">${fileSize} • ${file.downloads} downloads</p>
                <div class="flex gap-2">
                    <a href="/d/${file.id}" 
                       class="flex-1 text-center px-3 py-2 bg-primary text-white rounded-lg hover:bg-blue-700 text-sm font-semibold"
                       download>
                        Download
                    </a>
                    <button onclick="deleteFile('${file.id}')"
                            class="px-3 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 text-sm font-semibold">
                        <span class="material-symbols-outlined text-lg">delete</span>
                    </button>
                </div>
            </div>
        </div>
    `;
}

function switchView(view) {
    currentView = view;
    
    // Update button states
    const listBtn = document.getElementById('view-list-btn');
    const cardBtn = document.getElementById('view-card-btn');
    
    if (view === 'list') {
        listBtn.classList.add('bg-white', 'shadow');
        listBtn.classList.remove('bg-transparent');
        cardBtn.classList.remove('bg-white', 'shadow');
        cardBtn.classList.add('bg-transparent');
        
        // List layout
        document.getElementById('file-list').className = 'space-y-3';
    } else {
        cardBtn.classList.add('bg-white', 'shadow');
        cardBtn.classList.remove('bg-transparent');
        listBtn.classList.remove('bg-white', 'shadow');
        listBtn.classList.add('bg-transparent');
        
        // Grid layout
        document.getElementById('file-list').className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4';
    }
    
    // Re-render files and folders
    displayContent();
}

function renderFileList() {
    const fileListEl = document.getElementById('file-list');
    if (currentFiles.length === 0) {
        fileListEl.innerHTML = '<p class="text-center text-gray-500 py-8 col-span-full">Belum ada file yang diupload</p>';
    } else {
        fileListEl.innerHTML = currentFiles.map(file => createFileCard(file)).join('');
    }
}

function isImageFile(filename) {
    const ext = filename.split('.').pop().toLowerCase();
    return ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'svg'].includes(ext);
}

function copyLink() {
    navigator.clipboard.writeText(window.location.href).then(() => {
        alert('Link berhasil disalin!');
    });
}

// Countdown Timer
let countdownInterval = null;

function startCountdownTimer() {
    if (countdownInterval) clearInterval(countdownInterval);
    
    updateCountdown();
    countdownInterval = setInterval(updateCountdown, 1000);
}

function updateCountdown() {
    const expiresAt = new Date(currentRoom.expires_at);
    const now = new Date();
    const diff = expiresAt - now;
    
    if (diff <= 0) {
        document.getElementById('countdown-timer').innerHTML = '<span class="text-red-600">EXPIRED</span>';
        clearInterval(countdownInterval);
        setTimeout(() => {
            showErrorModal(
                'Room Telah Kadaluarsa',
                'Waktu room telah habis. Semua file akan dihapus dari server.'
            );
        }, 1000);
        return;
    }
    
    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((diff % (1000 * 60)) / 1000);
    
    let displayText = '';
    let colorClass = 'text-gray-800';
    
    if (days > 0) {
        displayText = `${days}<span class="text-sm">D</span> ${hours}<span class="text-sm">H</span>`;
    } else if (hours > 0) {
        displayText = `${hours}<span class="text-sm">H</span> ${minutes}<span class="text-sm">M</span>`;
        if (hours < 1) colorClass = 'text-orange-600';
    } else if (minutes > 0) {
        displayText = `${minutes}<span class="text-sm">M</span> ${seconds}<span class="text-sm">S</span>`;
        colorClass = 'text-orange-600';
    } else {
        displayText = `${seconds}<span class="text-sm">S</span>`;
        colorClass = 'text-red-600';
    }
    
    document.getElementById('countdown-timer').innerHTML = `<span class="${colorClass}">${displayText}</span>`;
}

// Download All as ZIP
let downloadAbortController = null;

async function downloadAllAsZip() {
    if (currentFiles.length === 0) {
        alert('Tidak ada file untuk didownload');
        return;
    }
    
    const progressEl = document.getElementById('download-progress');
    const queueList = document.getElementById('download-queue-list');
    const totalText = document.getElementById('download-total-text');
    
    progressEl.classList.remove('hidden');
    downloadAbortController = new AbortController();
    
    const totalFiles = currentFiles.length;
    let completedFiles = 0;
    
    // Create queue items for all files
    queueList.innerHTML = '';
    
    for (let i = 0; i < currentFiles.length; i++) {
        const file = currentFiles[i];
        const itemId = `download-item-${i}`;
        
        const itemHTML = `
            <div id="${itemId}" class="bg-gray-50 rounded-lg p-3 border border-gray-200">
                <div class="flex items-center gap-3 mb-2">
                    <input type="checkbox" id="${itemId}-checkbox" 
                           class="w-5 h-5 rounded border-gray-300 text-primary focus:ring-primary cursor-pointer" 
                           checked>
                    <span id="${itemId}-icon" class="material-symbols-outlined text-gray-400 text-xl">pending</span>
                    <div class="flex-1 min-w-0">
                        <p class="font-semibold text-sm truncate">${file.original_name}</p>
                        <p class="text-xs text-gray-600">${formatFileSize(file.size)}</p>
                    </div>
                    <span id="${itemId}-status" class="text-xs font-semibold text-gray-500">Pending</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2">
                    <div id="${itemId}-bar" class="bg-green-600 h-2 rounded-full transition-all" style="width: 0%"></div>
                </div>
            </div>
        `;
        
        queueList.innerHTML += itemHTML;
    }
    
    totalText.textContent = `0/${totalFiles}`;
    
    try {
        const zip = new JSZip();
        
        for (let i = 0; i < currentFiles.length; i++) {
            const file = currentFiles[i];
            const itemId = `download-item-${i}`;
            
            if (downloadAbortController.signal.aborted) {
                throw new Error('Download cancelled');
            }
            
            // Check if file is selected
            const checkbox = document.getElementById(`${itemId}-checkbox`);
            if (!checkbox.checked) {
                // Skip this file - mark as skipped
                document.getElementById(`${itemId}-icon`).textContent = 'remove_circle';
                document.getElementById(`${itemId}-icon`).className = 'material-symbols-outlined text-gray-400 text-xl';
                document.getElementById(`${itemId}-status`).textContent = 'Skipped';
                document.getElementById(`${itemId}-status`).className = 'text-xs font-semibold text-gray-500';
                continue;
            }
            
            // Update to downloading state
            document.getElementById(`${itemId}-icon`).textContent = 'download';
            document.getElementById(`${itemId}-icon`).className = 'material-symbols-outlined text-green-600 text-xl';
            document.getElementById(`${itemId}-status`).textContent = 'Downloading...';

        `;

            compression: 'DEFLATE',
            compressionOptions: { level: 6 }
        });
        
        const url = URL.createObjectURL(zipBlob);
        const a = document.createElement('a');

        a.download = `room-${currentRoom.pin}-files.zip`;

        // Auto-hide after 2 seconds

        }, 2000);
        
    } catch (error) {
        if (error.message === 'Download cancelled') {
            console.log('Download cancelled by user');
        } else {
            console.error('Download error:', error);
            alert('Gagal download files: ' + error.message);

function formatFileSize(bytes) {
    if (bytes === 0) return '0 B';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
}

async function uploadFiles(files) {
    const progressEl = document.getElementById('upload-progress-inline');
    const queueList = document.getElementById('upload-queue-list');
    const totalText = document.getElementById('upload-total-text');
    
    progressEl.classList.remove('hidden');
    uploadAbortController = new AbortController();
    uploadStartTime = Date.now();
    uploadedBytes = 0;
    
    const totalFiles = files.length;
    let completedFiles = 0;
    
    // Create queue items for all files
    queueList.innerHTML = '';
    const fileItems = [];
    
    for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const itemId = `upload-item-${i}`;
        
        const itemHTML = `
            <div id="${itemId}" class="bg-white rounded-lg p-3 border border-blue-200">
                <div class="flex items-center gap-3 mb-2">
                    <input type="checkbox" id="${itemId}-checkbox" 
                           class="w-5 h-5 rounded border-gray-300 text-primary focus:ring-primary cursor-pointer" 
                           checked>
                    <span id="${itemId}-icon" class="material-symbols-outlined text-gray-400 text-xl">pending</span>
                    <div class="flex-1 min-w-0">
                        <p class="font-semibold text-sm truncate">${file.name}</p>
                        <p class="text-xs text-gray-600">${formatFileSize(file.size)}</p>
                    </div>
                    <span id="${itemId}-status" class="text-xs font-semibold text-gray-500">Pending</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2">
                    <div id="${itemId}-bar" class="bg-blue-600 h-2 rounded-full transition-all" style="width: 0%"></div>
                </div>
            </div>
        `;
        
        queueList.innerHTML += itemHTML;
        fileItems.push({ id: itemId, file: file });
    }
    
    totalText.textContent = `0/${totalFiles}`;
    
    // Upload files sequentially
    for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const fileId = generateUUID();
        const itemId = `upload-item-${i}`;
        
        // Check if file is selected
        const checkbox = document.getElementById(`${itemId}-checkbox`);
        if (!checkbox.checked) {
            // Skip this file - mark as skipped
            document.getElementById(`${itemId}-icon`).textContent = 'remove_circle';
            document.getElementById(`${itemId}-icon`).className = 'material-symbols-outlined text-gray-400 text-xl';
            document.getElementById(`${itemId}-status`).textContent = 'Skipped';
            document.getElementById(`${itemId}-status`).className = 'text-xs font-semibold text-gray-500';
            continue;
        }
        
        // Update to uploading state
        document.getElementById(`${itemId}-icon`).textContent = 'upload_file';
        document.getElementById(`${itemId}-icon`).className = 'material-symbols-outlined text-blue-600 text-xl';
        document.getElementById(`${itemId}-status`).textContent = 'Uploading...';
        document.getElementById(`${itemId}-status`).className = 'text-xs font-semibold text-blue-600';
        checkbox.disabled = true;
        
        try {
            await uploadFileInChunks(file, fileId, currentRoom.id, (progress, bytesUploaded) => {
                document.getElementById(`${itemId}-bar`).style.width = progress + '%';
                document.getElementById(`${itemId}-status`).textContent = `${progress}%`;
            });
            
            // Update to completed state
            completedFiles++;
            document.getElementById(`${itemId}-icon`).textContent = 'check_circle';
            document.getElementById(`${itemId}-icon`).className = 'material-symbols-outlined text-green-600 text-xl';
            document.getElementById(`${itemId}-status`).textContent = 'Completed';
            document.getElementById(`${itemId}-status`).className = 'text-xs font-semibold text-green-600';
            document.getElementById(`${itemId}-bar`).style.width = '100%';
            document.getElementById(`${itemId}-bar`).className = 'bg-green-600 h-2 rounded-full transition-all';
            
            totalText.textContent = `${completedFiles}/${totalFiles}`;
            
        } catch (error) {
            if (error.message === 'Upload cancelled') {
                document.getElementById(`${itemId}-icon`).textContent = 'cancel';
                document.getElementById(`${itemId}-icon`).className = 'material-symbols-outlined text-orange-600 text-xl';
                document.getElementById(`${itemId}-status`).textContent = 'Cancelled';
                document.getElementById(`${itemId}-status`).className = 'text-xs font-semibold text-orange-600';
                console.log('Upload cancelled by user');
                break;
            }
            
            // Update to error state
            document.getElementById(`${itemId}-icon`).textContent = 'error';
            document.getElementById(`${itemId}-icon`).className = 'material-symbols-outlined text-red-600 text-xl';
            document.getElementById(`${itemId}-status`).textContent = 'Failed';
            document.getElementById(`${itemId}-status`).className = 'text-xs font-semibold text-red-600';
            
            console.error('Upload error:', error);
            alert(`Gagal upload ${file.name}`);
        }
    }
    
    // Reload content once after all uploads
    if (completedFiles > 0) {
        await loadTotalFileCount();
        await loadRoomContent();
        updateTotalFileDisplay();
    }
    
    // Auto-hide after 2 seconds if all completed
    if (completedFiles === totalFiles) {
        setTimeout(() => {
            progressEl.classList.add('hidden');
        }, 2000);
    }
}

async function uploadFileInChunks(file, fileId, roomId, onProgress) {
    const chunkSize = 10 * 1024 * 1024; // 10MB (increased for faster upload)
    const totalChunks = Math.ceil(file.size / chunkSize);
    let totalUploaded = 0;
    
    for (let i = 0; i < totalChunks; i++) {
        if (uploadAbortController.signal.aborted) {
            throw new Error('Upload cancelled');
        }
        
        const start = i * chunkSize;
        const end = Math.min(start + chunkSize, file.size);
        const chunk = file.slice(start, end);
        
        const formData = new FormData();
        formData.append('file', chunk);
        formData.append('chunkIndex', i);
        formData.append('totalChunks', totalChunks);
        formData.append('fileId', fileId);
        formData.append('originalName', file.name);
        formData.append('mimeType', file.type);
        formData.append('totalSize', file.size);
        formData.append('folderId', currentFolderId || '');
        
        const response = await fetch(`/api/upload/${roomId}`, {
            method: 'POST',
            body: formData,
            signal: uploadAbortController.signal
        });
        
        if (!response.ok) throw new Error('Upload failed');
        
        totalUploaded += chunk.size;
        const progress = Math.round(((i + 1) / totalChunks) * 100);
        onProgress(progress, totalUploaded);
    }
}

    if (uploadAbortController) {
        uploadAbortController.abort();
        document.getElementById('upload-progress-inline').classList.add('hidden');

function formatSpeed(bytesPerSecond) {
    if (bytesPerSecond < 1024) {
        return Math.round(bytesPerSecond) + ' B/s';
    } else if (bytesPerSecond < 1024 * 1024) {
        return (bytesPerSecond / 1024).toFixed(1) + ' KB/s';
    } else {
        return (bytesPerSecond / 1024 / 1024).toFixed(2) + ' MB/s';
    }
}

async function deleteFile(fileId) {
    if (!confirm('Yakin ingin menghapus file ini?')) return;
    
    try {
        const response = await fetch(`/api/file/${fileId}`, {
            method: 'DELETE'
        });
        
        if (response.ok) {
            await loadTotalFileCount();
            await loadRoomContent();
            updateTotalFileDisplay();
        } else {
            alert('Gagal menghapus file');
        }
    } catch (error) {
        console.error('Delete error:', error);
        alert('Gagal menghapus file');
    }
}

function generateUUID() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        const r = Math.random() * 16 | 0;
        const v = c == 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
    });
}

let selectedFiles = new Set();

function toggleFileSelection(fileId) {
    if (selectedFiles.has(fileId)) {
        selectedFiles.delete(fileId);
    } else {
        selectedFiles.add(fileId);
    }
    updateSelectionUI();
}

function toggleSelectAll() {
    const selectAllCheckbox = document.getElementById('select-all');
    const fileCheckboxes = document.querySelectorAll('.file-checkbox');
    
    if (selectAllCheckbox.checked) {
        // Select all
        selectedFiles.clear();
        currentFiles.forEach(file => selectedFiles.add(file.id));
        fileCheckboxes.forEach(cb => cb.checked = true);
    } else {
        // Deselect all
        selectedFiles.clear();
        fileCheckboxes.forEach(cb => cb.checked = false);
    }
    
    updateSelectionUI();
}

function updateSelectionUI() {
    const count = selectedFiles.size;
    const countEl = document.getElementById('selected-count');
    const downloadBtn = document.getElementById('download-selected-btn');
    const selectAllCheckbox = document.getElementById('select-all');
    
    // Update count
    countEl.textContent = `${count} dipilih`;
    
    // Update button state
    if (count > 0) {
        downloadBtn.disabled = false;
        downloadBtn.textContent = `Download ${count} File`;
    } else {
        downloadBtn.disabled = true;
        downloadBtn.innerHTML = '<span class="material-symbols-outlined text-lg">download</span> Download Terpilih';
    }
    
    // Update select all checkbox
    if (count === 0) {
        selectAllCheckbox.checked = false;
        selectAllCheckbox.indeterminate = false;
    } else if (count === currentFiles.length) {
        selectAllCheckbox.checked = true;
        selectAllCheckbox.indeterminate = false;
    } else {
        selectAllCheckbox.checked = false;
        selectAllCheckbox.indeterminate = true;
    }
    
    // Update visual selection state on cards
    document.querySelectorAll('.file-item').forEach(card => {
        const fileId = card.getAttribute('data-file-id');
        if (selectedFiles.has(fileId)) {
            card.classList.add('ring-2', 'ring-primary', 'bg-blue-50');
        } else {
            card.classList.remove('ring-2', 'ring-primary', 'bg-blue-50');
        }
    });
}

function getSelectedFiles() {
    return currentFiles.filter(file => selectedFiles.has(file.id));
}

async function downloadSelected() {
    const selected = getSelectedFiles();
    
    if (selected.length === 0) {
        alert('Pilih file terlebih dahulu');
        return;
    }
    
    if (selected.length === 1) {
        // Single file - direct download
        window.location.href = `/d/${selected[0].id}`;
        return;
    }
    
    // Multiple files - download as ZIP
    try {
        const zip = new JSZip();
        const progressEl = document.getElementById('download-progress');
        const progressBar = document.getElementById('download-bar');
        const progressText = document.getElementById('download-text');
        
        progressEl.classList.remove('hidden');
        let completed = 0;
        
        for (const file of selected) {
            const response = await fetch(`/d/${file.id}`);
            const blob = await response.blob();
            zip.file(file.original_name, blob);
            
            completed++;
            const percent = Math.round((completed / selected.length) * 100);
            progressBar.style.width = `${percent}%`;
            progressText.textContent = `${percent}% - ${completed}/${selected.length} files`;
        }
        
        const zipBlob = await zip.generateAsync({ type: 'blob' });
        const url = URL.createObjectURL(zipBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `selected-files-${Date.now()}.zip`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        
        progressEl.classList.add('hidden');
        
        // Clear selection after download
        selectedFiles.clear();
        document.querySelectorAll('.file-checkbox').forEach(cb => cb.checked = false);
        updateSelectionUI();
        
    } catch (error) {
        console.error('Download error:', error);
        alert('Gagal mendownload file');
        document.getElementById('download-progress').classList.add('hidden');
    }
}

    folderPath.push({ id: folderId, name: folderName });
    currentFolderId = folderId;
    loadRoomContent();
    renderBreadcrumb();
}

function navigateBack() {
    if (folderPath.length > 0) {
        folderPath.pop();
        currentFolderId = folderPath.length > 0 ? folderPath[folderPath.length - 1].id : null;
        loadRoomContent();
        renderBreadcrumb();

    renderBreadcrumb();

    const pathDisplay = document.getElementById('folder-path-display');

        navBar.classList.add('hidden');
        return;

    } catch (error) {
        console.error('Delete folder error:', error);
        alert('Gagal menghapus folder');
    }
}
</script>
