<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pending Approval | AmbilFile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .brutal-border { border: 3px solid #0f172a; }
        .brutal-shadow { box-shadow: 6px 6px 0px #0f172a; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-yellow-50 to-orange-100 flex items-center justify-center p-4">
    <div class="max-w-md w-full">
        <div class="bg-white brutal-border brutal-shadow p-8 rounded-lg text-center">
            <div class="w-20 h-20 bg-yellow-500 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl">
                ⏳
            </div>
            <h1 class="text-2xl font-bold text-slate-900 mb-4">Menunggu Approval</h1>
            <p class="text-slate-600 mb-6">
                Akun kamu sedang dalam review oleh admin. Kamu akan mendapat notifikasi via email setelah akun disetujui.
            </p>
            <div class="bg-slate-50 p-4 rounded brutal-border text-left text-sm space-y-2">
                <p class="font-semibold text-slate-900">Yang akan kamu dapatkan:</p>
                <ul class="space-y-1 text-slate-700">
                    <li>✓ Storage quota (default 5GB)</li>
                    <li>✓ Upload file hingga GB</li>
                    <li>✓ File duration hingga 7 hari</li>
                    <li>✓ Unlimited rooms</li>
                </ul>
            </div>
            <div class="mt-6">
                <a href="/" class="inline-block px-6 py-3 bg-slate-900 text-white font-semibold rounded brutal-border hover:bg-slate-800">
                    Kembali ke Home
                </a>
            </div>
        </div>
    </div>
</body>
</html>
