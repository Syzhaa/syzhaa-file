<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akun — AmbilFile</title>
    <link rel="icon" href="/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: #f7f8fa; color: #1a1a2e; min-height: 100vh; }
        .material-symbols-outlined { display: block; }
        header { background: #fff; border-bottom: 1px solid #e8eaf0; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
        .logo { text-decoration: none; font-weight: 800; font-size: 20px; color: #1a1a2e; }
        .logo span { color: #F6821F; }
        .userbox { display: flex; align-items: center; gap: 12px; }
        .userbox .name { font-size: 14px; font-weight: 600; }
        .logout { font-size: 13px; color: #dc2626; font-weight: 600; background: none; border: 0; cursor: pointer; font-family: inherit; }
        main { max-width: 880px; margin: 0 auto; padding: 32px 20px 120px; }
        h2 { font-size: 24px; font-weight: 800; margin-bottom: 4px; }
        .hello-sub { color: #6b7280; font-size: 14px; margin-bottom: 28px; }
        .card { background: #fff; border: 1px solid #e8eaf0; border-radius: 14px; padding: 24px; margin-bottom: 20px; }
        .card h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
        .card .desc { font-size: 13px; color: #6b7280; margin-bottom: 18px; }
        .keyrow { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid #e8eaf0; border-radius: 10px; margin-bottom: 10px; }
        .keyrow .kname { font-weight: 600; font-size: 14px; flex: 1; }
        .keyrow .kdate { font-size: 12px; color: #9ca3af; }
        .iconbtn { background: none; border: 1px solid #e8eaf0; border-radius: 8px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #6b7280; }
        .iconbtn:hover { border-color: #1a1a2e; color: #1a1a2e; }
        .iconbtn.danger:hover { border-color: #dc2626; color: #dc2626; }
        .empty { text-align: center; color: #9ca3af; font-size: 14px; padding: 24px 0; }
        .formrow { display: flex; gap: 10px; margin-top: 14px; }
        .formrow input { flex: 1; padding: 11px 14px; border: 1.5px solid #e8eaf0; border-radius: 10px; font-size: 14px; font-family: inherit; }
        .formrow input:focus { outline: none; border-color: #F6821F; }
        .btn { padding: 11px 20px; background: #F6821F; color: #fff; border: 0; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap; }
        .btn:hover { background: #e06f0e; }
        .btn:disabled { opacity: .6; cursor: not-allowed; }
        .newkey { display: none; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 10px; padding: 14px; margin-top: 14px; }
        .newkey p { font-size: 13px; color: #15803d; font-weight: 600; margin-bottom: 8px; }
        .keyval { display: flex; gap: 8px; align-items: center; }
        .keyval code { flex: 1; background: #fff; border: 1px dashed #bbf7d0; border-radius: 8px; padding: 10px 12px; font-size: 13px; word-break: break-all; font-family: ui-monospace, monospace; }
        .copybtn { background: #15803d; color: #fff; border: 0; border-radius: 8px; padding: 10px 14px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
        .roomrow { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid #e8eaf0; border-radius: 10px; margin-bottom: 10px; }
        .roomrow .pin { font-family: ui-monospace, monospace; font-weight: 700; font-size: 15px; letter-spacing: 2px; }
        .roomrow .meta { font-size: 12px; color: #9ca3af; flex: 1; }
        .roomrow a { font-size: 13px; color: #F6821F; font-weight: 600; text-decoration: none; }
        .info { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .info div { background: #f7f8fa; border-radius: 10px; padding: 12px 14px; }
        .info .lbl { font-size: 11px; color: #9ca3af; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
        .info .val { font-size: 14px; font-weight: 600; word-break: break-all; }
        .badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: #dcfce7; color: #15803d; }
        .storage-bar { margin-top: 16px; }
        .storage-top { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: #6b7280; margin-bottom: 8px; }
        .storage-track { height: 8px; background: #f1f2f6; border-radius: 99px; overflow: hidden; }
        .storage-fill { height: 100%; background: #F6821F; border-radius: 99px; width: 0%; transition: width .5s; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .stat { background: #fff; border: 1px solid #e8eaf0; border-radius: 14px; padding: 18px; display: flex; align-items: center; gap: 14px; }
        .stat .material-symbols-outlined { font-size: 32px; color: #F6821F; }
        .stat-num { font-size: 24px; font-weight: 800; }
        .stat-lbl { font-size: 12px; color: #9ca3af; font-weight: 600; }
        @media (max-width: 560px) { .info { grid-template-columns: 1fr; } .formrow { flex-direction: column; } }
        /* Info modal (pengganti alert) */
        .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; align-items: center; justify-content: center; padding: 16px; }
        .modal-backdrop.open { display: flex; }
        @media (max-width: 768px) {
            .modal-backdrop { align-items: flex-end; padding: 0; }
            .modal-backdrop.open { animation: fadeIn .2s ease-out; }
            .modal-box {
                border-radius: 24px 24px 0 0 !important; max-width: 100% !important;
                animation: slideUp .3s ease-out;
                max-height: 90vh; overflow-y: auto;
                padding-bottom: calc(28px + env(safe-area-inset-bottom)) !important;
            }
            .modal-box::before {
                content: ''; display: block;
                width: 40px; height: 4px; border-radius: 99px;
                background: #e8eaf0; margin: 0 auto 16px;
            }
            @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
            @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        }
        .modal-box { background: #fff; border-radius: 16px; padding: 28px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 16px 48px rgba(0,0,0,.15); }
        .modal-icon { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
        .modal-icon.ok { background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; }
        .modal-icon.err { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; }
        .modal-msg { font-size: 14px; font-weight: 500; margin-bottom: 20px; line-height: 1.5; }
        .modal-btn { width: 100%; padding: 12px; background: #1a1a2e; color: #fff; border: 0; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
        .modal-btn:hover { background: #000; }
    </style>
</head>
<body>
    <header>
        <a class="logo" href="/">Ambil<span>File</span></a>
        <div class="userbox">
            <span class="name" id="user-name">…</span>
            <button class="logout" onclick="logout()">Keluar</button>
        </div>
    </header>
    <main>
        <h2 id="greeting">Akun</h2>
        <p class="hello-sub">Informasi akun dan penggunaan penyimpananmu.</p>

        <div class="card">
            <h3><span class="material-symbols-outlined">person</span> Akun</h3>
            <p class="desc">Informasi akunmu.</p>
            <div class="info">
                <div><div class="lbl">Nama</div><div class="val" id="acc-name">—</div></div>
                <div><div class="lbl">Email</div><div class="val" id="acc-email">—</div></div>
                <div><div class="lbl">Status</div><div class="val"><span class="badge">Disetujui</span></div></div>
                <div><div class="lbl">Terdaftar</div><div class="val" id="acc-since">—</div></div>
            </div>
            <div class="storage-bar">
                <div class="storage-top"><span>Penyimpanan</span><span id="storage-label">—</span></div>
                <div class="storage-track"><div class="storage-fill" id="storage-fill"></div></div>
            </div>
        </div>

    <!-- Bottom Navigation (mobile) -->
    <nav class="bottom-nav">
            <a href="/user/" class="bnav-item">
                <span class="material-symbols-outlined">dashboard</span>
                <span>Dashboard</span>
            </a>
            <a href="/user/api-keys.html" class="bnav-item">
                <span class="material-symbols-outlined">key</span>
                <span>API Key</span>
            </a>
            <a href="/user/account.html" class="bnav-item active">
                <span class="material-symbols-outlined">person</span>
                <span>Akun</span>
            </a>
        </nav>

    <style>
        .bottom-nav { display: none; }
        @media (max-width: 768px) {
            .bottom-nav {
                display: flex;
                position: fixed;
                bottom: 0; left: 0; right: 0;
                background: #fff;
                border-top: 1px solid #e8eaf0;
                z-index: 40;
                padding-bottom: env(safe-area-inset-bottom);
            }
            .bnav-item {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 2px;
                padding: 10px 4px 8px;
                text-decoration: none;
                color: #9ca3af;
                font-size: 11px;
                font-weight: 600;
            }
            .bnav-item .material-symbols-outlined { font-size: 24px; }
            .bnav-item.active { color: #F6821F; }
        }
    </style>

    <!-- Info modal (pengganti alert) -->
    <div class="modal-backdrop" id="info-modal" onclick="if(event.target===this)closeInfoModal()">
        <div class="modal-box">
            <div class="modal-icon err" id="info-modal-icon"><span class="material-symbols-outlined" style="font-size:28px" id="info-modal-glyph">error</span></div>
            <p class="modal-msg" id="info-modal-msg"></p>
            <button class="modal-btn" onclick="closeInfoModal()">OK</button>
        </div>
    </div>

    <!-- Confirm modal (pengganti confirm) -->
    <div class="modal-backdrop" id="confirm-modal" onclick="if(event.target===this)closeConfirmModal()">
        <div class="modal-box">
            <div class="modal-icon err"><span class="material-symbols-outlined" style="font-size:28px">warning</span></div>
            <p class="modal-msg" id="confirm-modal-msg"></p>
            <div style="display:flex;gap:10px">
                <button class="modal-btn" style="background:#f1f2f6;color:#1a1a2e" onclick="closeConfirmModal()">Batal</button>
                <button class="modal-btn" style="background:#dc2626" id="confirm-modal-yes">Hapus</button>
            </div>
        </div>
    </div>

    <script>
        function showInfoModal(message, success = false) {
            const icon = document.getElementById('info-modal-icon');
            const glyph = document.getElementById('info-modal-glyph');
            icon.className = 'modal-icon ' + (success ? 'ok' : 'err');
            glyph.textContent = success ? 'check_circle' : 'error';
            document.getElementById('info-modal-msg').textContent = message;
            document.getElementById('info-modal').classList.add('open');
        }
        function closeInfoModal() {
            document.getElementById('info-modal').classList.remove('open');
        }

        let confirmCallback = null;
        function showConfirmModal(message, onYes) {
            document.getElementById('confirm-modal-msg').textContent = message;
            confirmCallback = onYes;
            document.getElementById('confirm-modal').classList.add('open');
        }
        function closeConfirmModal() {
            document.getElementById('confirm-modal').classList.remove('open');
            confirmCallback = null;
        }
        document.getElementById('confirm-modal-yes').addEventListener('click', () => {
            const cb = confirmCallback;
            closeConfirmModal();
            if (cb) cb();
        });

        async function api(path, opts = {}) {
            const res = await fetch(path, opts);
            if (res.status === 401) { window.location.href = '/user-login.html'; throw new Error('unauth'); }
            return res.json();
        }

        function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

        function setText(id, val) {
            const el = document.getElementById(id);
            if (el) el.textContent = val;
        }
        function setDisplay(id, val) {
            const el = document.getElementById(id);
            if (el) el.style.display = val;
        }

        async function load() {
            try {
                const me = await api('/user/me');
                const u = me.user;
                setText('user-name', u.name);
                setText('acc-name', u.name);
                setText('acc-email', u.email);
                setText('acc-since', new Date(u.created_at).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }));
                const usedBytes = me.storage_used_bytes || 0;
                const limitMB = u.storage_limit_mb || 2048;
                const limitBytes = limitMB * 1024 * 1024;
                const pct = limitBytes > 0 ? Math.min(100, Math.round(usedBytes / limitBytes * 100)) : 0;
                const fill = document.getElementById('storage-fill');
                if (fill) fill.style.width = pct + '%';
                setText('storage-label', (me.storage_used_label || '0 MB') + ' / ' + limitMB + ' MB');
            } catch { return; }
        }

        async function requestApiAccess() {
            const btn = document.getElementById('request-api-btn');
            btn.disabled = true;
            btn.textContent = 'Mengirim...';
            try {
                const res = await api('/user/api-keys/request', { method: 'POST' });
                if (res.success) {
                    document.getElementById('api-locked-msg').textContent = 'Permintaan terkirim! Tunggu persetujuan admin ya.';
                    btn.style.display = 'none';
                } else {
                    showInfoModal(res.error || 'Gagal mengirim permintaan');
                    btn.disabled = false;
                    btn.textContent = 'Minta Persetujuan';
                }
            } catch {
                showInfoModal('Tidak bisa terhubung ke server');
                btn.disabled = false;
                btn.textContent = 'Minta Persetujuan';
            }
        }
        async function createKey() {
            const btn = document.getElementById('create-key-btn');
            const name = document.getElementById('key-name').value.trim();
            btn.disabled = true;
            try {
                const data = await api('/user/api-keys', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name || 'API Key' })
                });
                if (data.success) {
                    document.getElementById('newkey-val').textContent = data.api_key.key;
                    document.getElementById('newkey-box').style.display = 'block';
                    document.getElementById('key-name').value = '';
                    load();
                } else {
                    showInfoModal(data.error || 'Gagal membuat API key');
                }
            } catch (e) { if (e.message !== 'unauth') showInfoModal('Tidak bisa terhubung ke server'); }
            btn.disabled = false;
        }

        async function deleteKey(id, name) {
            showConfirmModal(`Hapus API key "${name}"? Aplikasi yang memakainya akan berhenti bekerja.`, async () => {
                try {
                    const data = await api('/user/api-keys/' + id, { method: 'DELETE' });
                    if (data.success) load();
                    else showInfoModal(data.error || 'Gagal menghapus');
                } catch (e) { if (e.message !== 'unauth') showInfoModal('Tidak bisa terhubung ke server'); }
            });
        }

        function copyNewKey() {
            const v = document.getElementById('newkey-val').textContent;
            navigator.clipboard.writeText(v).then(() => {
                const b = document.querySelector('#newkey-box .copybtn');
                b.textContent = 'Tersalin!';
                setTimeout(() => b.textContent = 'Salin', 1500);
            });
        }

        async function logout() {
            await fetch('/auth/user/logout', { method: 'POST' });
            window.location.href = '/';
        }

        load();
    </script>
</body>
</html>
